[project]
name = "bravo-loadgen"
version = "0.1.0"
description = "부하 생성기와 관측 (T18): 쓰기 · 읽기 부하, DB 전수 대조 리포트, 판정용 창 요약. LLM을 쓰지 않는다."
requires-python = ">=3.12"
dependencies = [
    "bravo-observability",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "psycopg[binary]>=3.2",
    "rfc3339-validator>=0.1.4",
]

[project.scripts]
bravo-loadgen = "bravo_loadgen.cli:main"

[tool.uv.sources]
# 창 요약 내용은 T36 기준 구현을 그대로 쓴다. 코드를 두 벌로 두지 않는다.
bravo-observability = { path = "../observability" }

[dependency-groups]
dev = [
    "psutil>=6",
    "pytest>=8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bravo_loadgen"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# 줄 길이는 포매터가 맞춘다. 한국어 주석은 폭 계산이 길게 잡힌다.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
