# 로컬 시험용 Edge 대역. 실제 Cloudflare가 아니다.
# 요청마다 가중치로 나누기만 한다. X-Bravo-Env는 앱이 붙이므로 여기서 붙이지 않는다. 겹치면 "aws, aws"로 읽혀 환경 미확인이 된다.
# 연결 실패로 Edge가 직접 만든 오류에는 헤더가 없다. 계약 4절의 "Edge 오류 페이지"와 같은 모양이다.
upstream source { server host.docker.internal:__SOURCE_PORT__; keepalive 64; }
upstream target { server host.docker.internal:__TARGET_PORT__; keepalive 64; }

split_clients "${request_id}" $pool {
    __TARGET_PERCENT__% target;
    *                   source;
}

server {
    listen 8080;
    access_log off;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://$pool;
        proxy_intercept_errors off;
        error_page 502 504 = @edge_error;
    }

    location @edge_error {
        default_type text/plain;
        return 502 "edge error\n";
    }
}
