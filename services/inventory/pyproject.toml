[project]
name = "bravo-inventory"
version = "0.1.0"
description = "T16 의존성 · 설정 인벤토리: 정적 탐지 + 배포 추적(읽기 전용) + 레포·배포 대조 + 3등급 분류"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23,<5", "pyyaml>=6,<7"]

[project.optional-dependencies]
aws = ["boto3>=1.35,<2"]

[project.scripts]
bravo-inventory = "bravo_inventory.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bravo_inventory"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
