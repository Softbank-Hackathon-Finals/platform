# infra/envs/onprem/render-user-data.sh writes this file before the first RKE2 start.
# RKE2 sets log rotation and retention. Authenticated outbound shipping is separate.
apiVersion: audit.k8s.io/v1
kind: Policy
omitStages:
  - RequestReceived
omitManagedFields: true
rules:
  # Record access metadata, never request/response data carrying credentials.
  - level: Metadata
    resources:
      - group: ""
        resources: [secrets]
  - level: Metadata
    resources:
      - group: rbac.authorization.k8s.io
        resources: [roles, rolebindings, clusterroles, clusterrolebindings]
  - level: None
    nonResourceURLs: [/healthz, /healthz/*, /livez, /livez/*, /readyz, /readyz/*]
  - level: Metadata
