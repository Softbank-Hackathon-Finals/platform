[project]
name = "bravo-public-entry"
version = "0.1.0"
description = "Platform reconciler: Git-declared public hostnames -> Cloudflare Tunnel route, DNS and Access"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
bravo-public-entry = "bravo_public_entry.reconcile:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bravo_public_entry"]

[tool.ruff]
line-length = 130
