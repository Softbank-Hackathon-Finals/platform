[project]
name = "bravo-exit-drill"
version = "0.1.0"
description = "T27 Exit Drill: 차단 정책 생성 · 차단 뒤 판정 · 잔존 의존성 지도"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
bravo-exit-drill = "bravo_exit_drill.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bravo_exit_drill"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
