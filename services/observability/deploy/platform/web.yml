# T37 플랫폼 지표 저장소의 TLS. 쓰기(OTLP)와 조회 모두 클라이언트 인증서를 요구한다.
# client_allowed_sans는 이 플랫폼이 발급한 Collector · 콘솔 API 인증서의 이름이다(환경 등록과 함께 정한다).
# collector-platform은 플랫폼 클러스터 자신의 Collector다. 고객 Collector와 다른 CA(플랫폼 수신 CA)가 발급하며,
# ca.crt는 두 CA의 묶음이다(deploy/collector-platform).
tls_server_config:
  cert_file: /etc/bravo-tls/tls.crt
  key_file: /etc/bravo-tls/tls.key
  client_ca_file: /etc/bravo-tls/ca.crt
  client_auth_type: RequireAndVerifyClientCert
  client_allowed_sans: [collector-aws, collector-onprem, collector-platform, console-api]
  min_version: TLS13
