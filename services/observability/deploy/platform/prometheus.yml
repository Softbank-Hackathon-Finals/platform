# T37 플랫폼 지표 저장소. Collector가 OTLP로 보낸 지표만 받는다(직접 긁지 않는다).
# 실행 옵션: --web.enable-otlp-receiver --web.config.file=web.yml --storage.tsdb.retention.time=3d
# 수신 · 조회 모두 mTLS(web.yml). 네트워크에서도 Collector · 콘솔 API만 닿게 막는다(Tailscale ACL, NetworkPolicy).

global:
  evaluation_interval: 10s

rule_files:
  - rules/alerts.yml

otlp:
  # bravo.env → bravo_env 라벨: 환경별 조회의 기준
  # bravo.signal → bravo_signal 라벨: Collector가 정한 출처. collector-self(생존 신호, "확인 불가" 판정의 기준) ·
  #   cnpg-scrape(DB 긁기). 앱 경로에서는 지워지므로 앱이 출처를 사칭할 수 없다
  promote_resource_attributes: [bravo.env, bravo.signal]

storage:
  tsdb:
    # 보내는 방식이라 재시도로 늦게 도착한 표본을 받는다
    out_of_order_time_window: 10m
