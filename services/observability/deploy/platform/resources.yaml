# T37 플랫폼 지표 저장소. 플랫폼 클러스터(VPC ②)에 하나 둔다.
# 배포 전에 Secret bravo-prometheus-tls(ca.crt · tls.crt · tls.key)를 만든다. 서버 인증서 이름은
# Collector가 부르는 주소(서비스 DNS, 노드 주소)를 포함해야 한다. 값은 git에 두지 않는다.
# 콘솔 API 네임스페이스에 bravo.observability/platform-client=true 라벨을 붙여야 조회할 수 있다.
apiVersion: v1
kind: Namespace
metadata:
  name: bravo-observability
  labels:
    component: platform
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bravo-prometheus
  namespace: bravo-observability
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bravo-prometheus
  namespace: bravo-observability
  labels:
    app: bravo-prometheus
    component: platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bravo-prometheus
  template:
    metadata:
      labels:
        app: bravo-prometheus
        component: platform
    spec:
      serviceAccountName: bravo-prometheus
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --web.config.file=/etc/prometheus/web.yml
            - --web.enable-otlp-receiver
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=3d
            - --storage.tsdb.retention.size=4GB
          ports:
            - {name: web, containerPort: 9090}
          # 모든 HTTP 경로가 클라이언트 인증서를 요구하므로 kubelet probe는 TCP로 본다
          readinessProbe:
            tcpSocket: {port: web}
          livenessProbe:
            tcpSocket: {port: web}
            initialDelaySeconds: 15
          # 실측(위와 같은 부하): 최대 메모리 83MiB, 평균 CPU 15m, 최대 42m. 평상시 72MiB · 4m.
          # 압축(compaction) · 조회 순간치를 감안해 limit을 크게 둔다. 시계열 종류가 늘면 다시 잰다
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus/prometheus.yml, subPath: prometheus.yml, readOnly: true}
            - {name: config, mountPath: /etc/prometheus/web.yml, subPath: web.yml, readOnly: true}
            - {name: rules, mountPath: /etc/prometheus/rules, readOnly: true}
            - {name: tls, mountPath: /etc/bravo-tls, readOnly: true}
            - {name: data, mountPath: /prometheus}
      volumes:
        - name: config
          configMap:
            name: bravo-prometheus-config
        - name: rules
          configMap:
            name: bravo-prometheus-rules
        - name: tls
          secret:
            secretName: bravo-prometheus-tls
            defaultMode: 0440
        # 보존 3일. Pod가 다른 노드로 옮겨지면 잃는다(저장소 클래스가 정해지면 PVC로 바꾼다).
        # 판정의 근거는 판정 기록에 따로 남으므로 이 데이터가 없어도 판정은 다시 계산된다.
        - name: data
          emptyDir:
            sizeLimit: 5Gi
---
# 다른 클러스터의 Collector가 노드 주소:30990으로 보낸다. 원래 출발지 주소를 보존해 NetworkPolicy가 판단하게 한다.
apiVersion: v1
kind: Service
metadata:
  name: bravo-prometheus
  namespace: bravo-observability
  labels:
    component: platform
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app: bravo-prometheus
  ports:
    - {name: web, port: 9090, targetPort: web, nodePort: 30990}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bravo-prometheus
  namespace: bravo-observability
spec:
  podSelector:
    matchLabels:
      app: bravo-prometheus
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        # 같은 네임스페이스의 Collector(플랫폼 자신의 지표)
        - podSelector:
            matchLabels:
              app: bravo-collector
        # 같은 네임스페이스의 콘솔용 조회 API
        - podSelector:
            matchLabels:
              app: bravo-observability-api
        # 같은 클러스터의 콘솔 API. 라벨은 kubectl label로 붙인다(Namespace 매니페스트를 apply하면 없는 라벨이 지워진다)
        - namespaceSelector:
            matchLabels:
              bravo.observability/platform-client: "true"
        # 다른 클러스터의 Collector(Tailscale 주소 대역). 출발지 VPC 주소는 배포할 때 ipBlock으로 추가한다
        - ipBlock:
            cidr: 100.64.0.0/10
      ports:
        - {port: 9090, protocol: TCP}
  # 지표를 긁지 않는다. 밖으로 나갈 일이 없다
  egress: []
---
# 콘솔용 조회 API. 이미지 주소는 배포 파이프라인이 kustomize images로 digest를 정한다(이 파일에는 논리 이름만).
# 배포 전에 Secret bravo-observability-api-tls(console-api 인증서)와 bravo-observability-api-token(token, 32자 이상)을 만든다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bravo-observability-api
  namespace: bravo-observability
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bravo-observability-api
  namespace: bravo-observability
  labels:
    app: bravo-observability-api
    component: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bravo-observability-api
  template:
    metadata:
      labels:
        app: bravo-observability-api
        component: platform
    spec:
      serviceAccountName: bravo-observability-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # 인증서 Secret(0440)을 그룹 권한으로 읽는다
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # 배포 파이프라인이 kustomize images로 레지스트리@digest를 넣는다. 넣지 않으면 pull이 실패한다(최신 이미지를 아무거나 받지 않음)
          image: bravo-observability-api:set-by-deploy-pipeline
          env:
            - {name: PROMETHEUS_URL, value: "https://bravo-prometheus.bravo-observability.svc:9090"}
            - {name: BRAVO_ENVIRONMENTS, value: "aws,onprem"}
            - name: BRAVO_OBSERVABILITY_API_TOKEN
              valueFrom:
                secretKeyRef: {name: bravo-observability-api-token, key: token}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
          # 실측: 최대 메모리 50MiB, 평균 CPU 4m, 최대 16m
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 500m, memory: 192Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: tls, mountPath: /etc/bravo-tls, readOnly: true}
      volumes:
        - name: tls
          secret:
            secretName: bravo-observability-api-tls
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: bravo-observability-api
  namespace: bravo-observability
  labels:
    component: platform
spec:
  selector:
    app: bravo-observability-api
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bravo-observability-api
  namespace: bravo-observability
spec:
  podSelector:
    matchLabels:
      app: bravo-observability-api
  policyTypes: [Ingress, Egress]
  ingress:
    # 콘솔 · 플랫폼 API 네임스페이스에서만. 상태 확인(kubelet probe)은 응답에 데이터가 없다
    - from:
        - namespaceSelector:
            matchLabels:
              bravo.observability/platform-client: "true"
      ports:
        - {port: 8080, protocol: TCP}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - podSelector:
            matchLabels:
              app: bravo-prometheus
      ports:
        - {port: 9090, protocol: TCP}
