# DB(CNPG)와 PgBouncer가 함께 있는 클러스터의 Collector(출발지 T6, 목적지 T30).
# collector-db를 다 만든 뒤 PgBouncer component를 더한다. collector-db가 Collector 인자를 바꿔 쓰므로 이 순서여야 한다.
# DB 네임스페이스 권한은 deploy/collector-db-access를 함께 적용한다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# component가 만드는 ConfigMap도 같은 네임스페이스여야 Collector 볼륨 이름(hash)이 연결된다
namespace: bravo-observability
resources:
  - ../collector-db
components:
  - ../components/pgbouncer
