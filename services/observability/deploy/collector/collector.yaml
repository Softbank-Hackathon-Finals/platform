# T37 클러스터별 OpenTelemetry Collector. 출발지 · 목적지에 하나씩 둔다.
# BRAVO_ENV(환경 이름)와 PLATFORM_OTLP_ENDPOINT는 배포가 정한다. 앱이 보낸 bravo.env는 지우고 이 값으로 덮어쓴다.
# 판정 입력이 아니다(ADR-0010). 판정은 T18 창 요약만 쓴다.
# 플랫폼으로 보내는 경로는 mTLS다. 인증서는 배포가 /etc/bravo-tls에 넣는다(ca.crt · tls.crt · tls.key).

extensions:
  # 플랫폼에 보내지 못한 지표를 디스크에 쌓아 두고, 재시작 뒤에도 보낸다
  file_storage/queue:
    directory: /var/lib/otelcol/queue
    timeout: 1s
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  # 앱 지표 (클러스터 안에서만 받는다)
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  # 수집 경로 생존 신호: Collector 자신의 지표를 긁어 플랫폼에서 환경별 최근 수신 시각으로 쓴다.
  prometheus/self:
    config:
      scrape_configs:
        - job_name: bravo-collector
          scrape_interval: 10s
          static_configs:
            - targets: ["127.0.0.1:8888"]

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  # 허용 목록: 앱이 보낸 속성 중 아래만 남긴다. 채팅 본문 · 헤더 · 토큰 · SQL 파라미터는 남지 않는다.
  transform/allowlist:
    error_mode: propagate
    metric_statements:
      - context: resource
        statements:
          - keep_keys(resource.attributes, ["service.name", "service.instance.id"])
      - context: datapoint
        statements:
          - keep_keys(datapoint.attributes, ["http.request.method", "http.response.status_code", "http.route"])
  # 생존 신호에만 붙는 신뢰 라벨. 앱 경로는 허용 목록이 bravo.signal을 지우므로 앱이 생존 신호를 사칭할 수 없다.
  # job 라벨(service.name)은 앱도 보낼 수 있어 생존 신호를 고르는 데 쓰지 않는다.
  resource/self:
    attributes:
      - key: service.name
        value: bravo-collector
        action: upsert
      - key: bravo.signal
        value: collector-self
        action: upsert
  resource/env:
    attributes:
      - key: bravo.env
        value: ${env:BRAVO_ENV}
        action: upsert
  batch: {}

exporters:
  otlp_http/platform:
    endpoint: ${env:PLATFORM_OTLP_ENDPOINT}
    tls:
      ca_file: /etc/bravo-tls/ca.crt
      cert_file: /etc/bravo-tls/tls.crt
      key_file: /etc/bravo-tls/tls.key
    sending_queue:
      enabled: true
      storage: file_storage/queue
      queue_size: 5000
    # 지표 저장소가 늦게 도착한 표본을 받는 기간(prometheus.yml out_of_order_time_window)과 맞춘다
    retry_on_failure:
      enabled: true
      max_elapsed_time: 10m

service:
  extensions: [file_storage/queue, health_check]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 8888
  pipelines:
    metrics/app:
      receivers: [otlp]
      processors: [memory_limiter, transform/allowlist, resource/env, batch]
      exporters: [otlp_http/platform]
    metrics/self:
      receivers: [prometheus/self]
      processors: [memory_limiter, resource/self, resource/env, batch]
      exporters: [otlp_http/platform]
