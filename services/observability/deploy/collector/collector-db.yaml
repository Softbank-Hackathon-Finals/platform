# T37 DB 지표(CNPG) 수집. DB가 있는 클러스터에서만 deploy/collector-db 오버레이가 이 파일을 두 번째 --config로 더한다.
# BRAVO_DB_NAMESPACE의 CNPG 인스턴스 Pod(cnpg.io/podRole=instance)의 metrics 포트(9187)를 긁는다.
# DB 지표는 운영 화면 · 알림용이다. 컷오버 조건의 복제 지연은 Executor가 DB에서 직접 읽는다(설계 8.6).
receivers:
  prometheus/db:
    config:
      scrape_configs:
        - job_name: bravo-cnpg
          scrape_interval: 15s
          kubernetes_sd_configs:
            - role: pod
              namespaces:
                names: ["${env:BRAVO_DB_NAMESPACE}"]
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_label_cnpg_io_podRole, __meta_kubernetes_pod_container_port_name]
              regex: instance;metrics
              action: keep
            - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
              target_label: cnpg_cluster
            - source_labels: [__meta_kubernetes_pod_name]
              target_label: pod
            - source_labels: [__meta_kubernetes_pod_label_cnpg_io_instanceRole]
              target_label: instance_role

service:
  pipelines:
    metrics/db:
      receivers: [prometheus/db]
      processors: [memory_limiter, resource/env, batch]
      exporters: [otlp_http/platform]
