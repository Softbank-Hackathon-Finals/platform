# DB(CNPG)가 있는 클러스터의 Collector. 기본 Collector에 DB 수집 설정 · 서비스 계정 토큰 · 나가는 연결을 더한다.
# DB 네임스페이스 쪽 권한은 deploy/collector-db-access를 함께 적용한다.
# bravo-collector-env ConfigMap에 BRAVO_DB_NAMESPACE가 없으면 Pod가 시작하지 않는다(모든 네임스페이스를 긁지 않게).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../collector
patches:
  - target: {kind: Deployment, name: bravo-collector}
    patch: |-
      - op: replace
        path: /spec/template/spec/automountServiceAccountToken
        value: true
      - op: replace
        path: /spec/template/spec/containers/0/args
        value: ["--config=/etc/otelcol/collector.yaml", "--config=/etc/otelcol/collector-db.yaml"]
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: BRAVO_DB_NAMESPACE
          valueFrom:
            configMapKeyRef: {name: bravo-collector-env, key: BRAVO_DB_NAMESPACE}
  - target: {kind: NetworkPolicy, name: bravo-collector}
    patch: |-
      # Pod 목록 조회(쿠버네티스 API)와 CNPG 지표 포트
      - op: add
        path: /spec/egress/-
        value:
          ports:
            - {port: 443, protocol: TCP}
            - {port: 6443, protocol: TCP}
      - op: add
        path: /spec/egress/-
        value:
          ports:
            - {port: 9187, protocol: TCP}
