# 플랫폼 Argo의 observability Application이 동기화하는 플랫폼 관측 묶음(infra/gitops/argocd).
# 저장소(bravo-observability) · 플랫폼 자체 Collector(platform-telemetry) · 플랫폼 DB 쪽 권한(platform-state).
# Namespace는 클러스터를 세우는 쪽이 갖는다(T44와 같은 원칙): 여기서는 선언하지 않는다.
# TLS Secret(bravo-prometheus-tls, bravo-collector-tls)은 Git에 두지 않고 배포 전에 있어야 한다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../platform-store
  - ../collector-platform
  - ../collector-platform-db-access
patches:
  - target: {kind: Namespace}
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: any
