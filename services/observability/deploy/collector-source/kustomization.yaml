# 출발지(AWS EKS) Collector: DB · PgBouncer 지표 + 앱 OTLP 수신 mTLS(Secret bravo-collector-app-tls).
# 출발지에는 OpenBao가 없어 앱 CA는 cert-manager가 클러스터 안에서 만든다(deploy/app-pki-source). 목적지는 collector-target(OpenBao PKI).
# app-pki-source를 먼저 적용해 두 Certificate가 Ready인 뒤 이 묶음을 적용한다(Secret에 ca.crt가 있어야 Collector가 뜬다).
# 앱 namespace(source-dev)에는 bravo.observability/send=true 라벨과 클라이언트 인증서 Secret bravo-app-metrics-client가 필요하다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bravo-observability
resources:
  - ../collector-db-pgbouncer
components:
  - ../components/app-mtls
  - ../components/app-mtls-cert-manager
# 이전 역할: 이 Collector의 지표는 bravo_role=source(출발지, ADR-0034). 환경 종류(aws · gcp · onprem)와 무관하게 역할로 정한다.
# bravo-collector-env의 BRAVO_ROLE(선택)보다 이 값이 우선한다. 환경 이름(BRAVO_ENV)은 그대로 ConfigMap이 정한다.
patches:
  - target: {kind: Deployment, name: bravo-collector}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: bravo-collector
      spec:
        template:
          spec:
            containers:
              - name: collector
                env:
                  - {name: BRAVO_ROLE, value: source, valueFrom: null}
