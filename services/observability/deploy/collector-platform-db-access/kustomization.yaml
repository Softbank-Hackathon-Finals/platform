# 플랫폼 DB(platform-state) 쪽: platform-telemetry의 Collector가 CNPG Pod를 찾는 읽기 권한과 9187 수신 허용.
# platform-state는 기본 차단(default-deny)이라 허용 정책이 따로 필요하다. 이 정책은 이미 격리된 DB Pod에 허용만 더한다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform-state
resources:
  - ../collector-db-access
  - metrics-ingress.yaml
patches:
  - target: {kind: RoleBinding, name: bravo-collector-db-discovery}
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: platform-telemetry
