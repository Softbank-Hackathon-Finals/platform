apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bravo-collector-db-metrics
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: platform-db
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-telemetry
          podSelector:
            matchLabels:
              app: bravo-collector
      ports:
        - {port: 9187, protocol: TCP}
