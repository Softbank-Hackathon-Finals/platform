[project]
name = "bravo-observability"
version = "0.1.0"
description = "T36 SLI window construction and deterministic SHIFT/WATCH judgement"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# 콘솔용 조회 API와 창 수신 API. 판정 라이브러리만 쓰는 쪽(T17 · T18)은 설치하지 않는다
api = ["fastapi>=0.115,<1", "httpx>=0.27,<1", "uvicorn>=0.30,<1", "jsonschema>=4.23,<5", "rfc3339-validator>=0.1.4"]

[project.scripts]
bravo-observability-api = "bravo_observability.api:main"
bravo-observability-intake = "bravo_observability.intake_api:main"

[dependency-groups]
dev = ["pytest>=8,<10", "jsonschema>=4.23,<5", "rfc3339-validator>=0.1.4", "fastapi>=0.115,<1", "httpx>=0.27,<1", "uvicorn>=0.30,<1"]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bravo_observability"]

# 계약 스키마의 정본(docs/observability)을 패키지에 함께 넣는다. 저장소 전체를 빌드 컨텍스트로 써야 한다(Dockerfile)
[tool.hatch.build.targets.wheel.force-include]
"../../docs/observability/sli.schema.json" = "bravo_observability/sli.schema.json"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
