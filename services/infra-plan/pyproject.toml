[project]
name = "bravo-infra-plan"
version = "0.1.0"
description = "T44 목적지 구축 계획: 정형 스택 → 렌더 → 계획 digest (ADR-0032)"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23,<5", "pyyaml>=6.0.3,<7"]

[project.scripts]
bravo-infra-plan = "bravo_infra_plan.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bravo_infra_plan"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
