# T34 candidate policy for the T2/T30 owner's review, not an automatic apply.
# Retention, rotation, authenticated outbound shipping and disk quota are also required.
apiVersion: audit.k8s.io/v1
kind: Policy
omitStages:
  - RequestReceived
omitManagedFields: true
rules:
  # Record access metadata, never request/response data carrying credentials.
  - level: Metadata
    resources:
      - group: ""
        resources: [secrets]
  - level: Metadata
    resources:
      - group: rbac.authorization.k8s.io
        resources: [roles, rolebindings, clusterroles, clusterrolebindings]
  - level: None
    nonResourceURLs: [/healthz, /healthz/*, /livez, /livez/*, /readyz, /readyz/*]
  - level: Metadata
