[project]
name = "bravo-controls"
version = "0.1.0"
description = "T14 deterministic control observations and T5 ControlRun production"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
aws = ["botocore>=1.35,<2"]
postgres = ["psycopg[binary]>=3.3.6,<4"]

[dependency-groups]
dev = ["pytest>=8,<10", "botocore>=1.35,<2", "psycopg[binary]>=3.3.6,<4"]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bravo_controls"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
