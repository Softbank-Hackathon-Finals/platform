[project]
name = "bravo-rehearsal-runner"
version = "0.1.0"
description = "리허설 러너 (T15). 지금은 리허설 네임스페이스 템플릿과 격리 시험(T3)만 있다"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rehearsal_runner"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# 줄 길이는 포매터가 맞춘다. 한국어 주석은 폭 계산이 길게 잡힌다.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
