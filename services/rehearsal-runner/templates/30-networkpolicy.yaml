# 리허설 네임스페이스 네트워크 규칙 (ADR-0002).
# 수신 · 송신을 모두 막고, 아래만 연다.
#   - 같은 네임스페이스 Pod끼리
#   - kube-dns 53번 (서비스 이름 조회)
#   - 목적지 프로필: 시험용 SeaweedFS(S3) · OpenBao의 지정한 Pod · 포트만
# 목적지 프로필 값은 profiles/<환경>.env에 있다. 포트는 Service 포트가 아니라 Pod의 컨테이너 포트(targetPort)다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: ${NAMESPACE}
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: ${NAMESPACE}
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: ${NAMESPACE}
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-target-profile
  namespace: ${NAMESPACE}
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ${SEAWEEDFS_NAMESPACE}
          podSelector:
            matchLabels:
              ${SEAWEEDFS_LABEL_KEY}: ${SEAWEEDFS_LABEL_VALUE}
      ports:
        - protocol: TCP
          port: ${SEAWEEDFS_PORT}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ${OPENBAO_NAMESPACE}
          podSelector:
            matchLabels:
              ${OPENBAO_LABEL_KEY}: ${OPENBAO_LABEL_VALUE}
      ports:
        - protocol: TCP
          port: ${OPENBAO_PORT}
