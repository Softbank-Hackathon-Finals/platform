# rehearsal-exec: 도구 계층(rehearsal.exec)이 대신 실행할 때 쓰는 계정. 토큰은 러너가 짧게 발급한다(kubectl create token).
# Pod 안에는 어떤 서비스 계정 토큰도 자동으로 넣지 않는다. 자동 생성되는 default 계정도 같이 끈다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rehearsal-exec
  namespace: ${NAMESPACE}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: ${NAMESPACE}
automountServiceAccountToken: false
