[project]
name = "bravo-agent-worker"
version = "0.1.0"
description = "T11 S2 failure analysis and bounded proposals; execution belongs to T15"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.40,<2",
    "cryptography==50.0.2",
    "httpx>=0.28,<1",
    "openai==3.42.1",
    "openai-agents==0.24.0",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "pydantic>=2.11,<3",
    "pyjwt[crypto]>=2.10,<3",
]

[project.scripts]
bravo-agent = "bravo_agent.cli:main"
bravo-subscription = "bravo_agent.subscription_admin:main"

[project.optional-dependencies]
claude = ["claude-agent-sdk==0.2.177"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.14,<1",
    "claude-agent-sdk==0.2.177",
    "pyyaml>=6,<7",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bravo_agent"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
