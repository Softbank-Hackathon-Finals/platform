# 한 환경(출발지 src · 목적지 dst)의 DB · PgBouncer · demo-chat. mockenv.py가 대문자 자리표시자(NS 등)를 채워 적용한다.
# 출발지 · 목적지 모두 PgBouncer는 처음에 출발지 DB를 가리킨다(설계 문서 8.6 "전환 전 쓰기 경로").
# 같은 클러스터의 네임스페이스 간 접속이 Tailscale 경로를 대신한다.
apiVersion: v1
kind: Namespace
metadata:
  name: ${NS}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ${NS}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: ${POSTGRES_IMAGE}
          args: ["-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
          env:
            - {name: POSTGRES_DB, value: chat}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: mock-credentials, key: postgres-password}}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "postgres", "-d", "chat"]}
            periodSeconds: 2
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ${NS}
spec:
  type: NodePort
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432, nodePort: ${PG_NODEPORT}}]
---
# PgBouncer 설정은 ConfigMap · Secret을 initContainer가 emptyDir로 복사해 쓴다.
# Executor가 파드 안 파일을 바꾸고 RELOAD한다(spec D3). 파드가 재시작하면 ConfigMap 값으로 돌아간다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: ${NS}
data:
  pgbouncer.ini: |
    [databases]
    chat = host=${UPSTREAM_HOST} port=5432 dbname=chat

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 6432
    auth_type = scram-sha-256
    auth_file = /etc/pgbouncer/userlist.txt
    admin_users = cutover_control
    pool_mode = transaction
    ignore_startup_parameters = extra_float_digits,options
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: ${NS}
spec:
  replicas: 1
  selector:
    matchLabels: {app: pgbouncer}
  template:
    metadata:
      labels: {app: pgbouncer}
    spec:
      initContainers:
        - name: copy-config
          image: ${PGBOUNCER_IMAGE}
          command: ["sh", "-c", "cp /seed/config/pgbouncer.ini /seed/users/userlist.txt /etc/pgbouncer/"]
          volumeMounts:
            - {name: config, mountPath: /etc/pgbouncer}
            - {name: seed-config, mountPath: /seed/config}
            - {name: seed-users, mountPath: /seed/users}
      containers:
        - name: pgbouncer
          image: ${PGBOUNCER_IMAGE}
          command: ["pgbouncer", "/etc/pgbouncer/pgbouncer.ini"]
          ports: [{containerPort: 6432}]
          readinessProbe:
            tcpSocket: {port: 6432}
            periodSeconds: 2
          volumeMounts: [{name: config, mountPath: /etc/pgbouncer}]
      volumes:
        - {name: config, emptyDir: {}}
        - {name: seed-config, configMap: {name: pgbouncer-config}}
        - {name: seed-users, secret: {secretName: pgbouncer-users}}
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  namespace: ${NS}
spec:
  type: NodePort
  selector: {app: pgbouncer}
  ports: [{port: 6432, targetPort: 6432, nodePort: ${PGB_NODEPORT}}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-chat
  namespace: ${NS}
spec:
  replicas: 2
  selector:
    matchLabels: {app: demo-chat}
  template:
    metadata:
      labels: {app: demo-chat}
    spec:
      containers:
        - name: app
          image: ${APP_IMAGE}
          imagePullPolicy: Never
          env:
            - {name: APP_ENV, value: "${APP_ENV}"}
            - {name: DB_HOST, value: pgbouncer}
            - {name: DB_PORT, value: "6432"}
            - {name: DB_NAME, value: chat}
            - {name: DB_SECRET_ID, value: demo-chat/db}
            - {name: S3_BUCKET, value: demo-chat-attachments}
            - {name: S3_ENDPOINT_URL, value: "http://moto.aws.svc:5000"}
            - {name: S3_FORCE_PATH_STYLE, value: "true"}
            - {name: AWS_ENDPOINT_URL_SECRETS_MANAGER, value: "http://moto.aws.svc:5000"}
            - {name: AWS_DEFAULT_REGION, value: ap-northeast-1}
            - {name: AWS_ACCESS_KEY_ID, value: local}
            - {name: AWS_SECRET_ACCESS_KEY, value: local}
            - name: ADMIN_TOKEN
              valueFrom: {secretKeyRef: {name: mock-credentials, key: admin-token}}
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /readyz, port: 8080}
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: demo-chat
  namespace: ${NS}
spec:
  type: NodePort
  selector: {app: demo-chat}
  ports: [{port: 8080, targetPort: 8080, nodePort: ${APP_NODEPORT}}]
