[project]
name = "bravo-cutover"
version = "0.1.0"
description = "Cutover Executor (T12): 쓰기 정지 구간을 정해진 순서로 실행한다. LLM을 쓰지 않는다."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "kubernetes>=31",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.2",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bravo_cutover"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# 줄 길이는 포매터가 맞춘다. 한국어 주석은 폭 계산이 길게 잡힌다.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
