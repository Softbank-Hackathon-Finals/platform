[project]
name = "bravo-console"
version = "0.1.0"
description = "T21 same-origin console for the authenticated T10 API"
requires-python = ">=3.12"
dependencies = ["starlette>=1.3.1,<2", "httpx>=0.28,<1", "jsonschema>=4.26,<5"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.14,<0.18", "bravo-platform-events==0.1.0", "uvicorn>=0.30,<1"]

[tool.uv.sources]
bravo-platform-events = { path = "../platform-events" }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bravo_console"]

[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
