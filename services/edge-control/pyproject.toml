[project]
name = "bravo-edge-control"
version = "0.1.0"
description = "T17 durable Cloudflare weight adapter for the trusted T10 host"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1", "bravo-observability[api]"]

[tool.uv.sources]
bravo-observability = { git = "https://github.com/Softbank-Hackathon-Finals/platform.git", rev = "555956b56e4f22b49036e2a9ed0fcd3f7f97eb79", subdirectory = "services/observability" }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bravo_edge_control"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
