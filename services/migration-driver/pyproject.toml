[project]
name = "bravo-migration"
version = "0.1.0"
description = "T49 migration driver: one request runs the happy path through the team's own components (T45, T10, T12, T14, T19). No LLM."
requires-python = ">=3.12"
dependencies = [
    "bravo-infra-plan",
    "cryptography>=43",
]

[project.scripts]
bravo-migration = "bravo_migration.cli:main"

[dependency-groups]
dev = ["pytest>=8"]
# The isolated E2E runs the real T10 approval code locally (e2e/t10_host.py).
e2e = ["bravo-platform-events", "uvicorn>=0.32"]

[tool.uv.sources]
bravo-infra-plan = { path = "../infra-plan", editable = true }
bravo-platform-events = { path = "../platform-events", editable = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bravo_migration"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# 줄 길이는 포매터가 맞춘다. 한국어 주석은 폭 계산이 길게 잡힌다.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
