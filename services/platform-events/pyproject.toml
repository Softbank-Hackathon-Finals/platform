[project]
name = "bravo-platform-events"
version = "0.1.0"
description = "T10 SSE contract proposal and local replay adapter for T21/T24"
requires-python = ">=3.12"
dependencies = [
    "bravo-observability[api]",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "pyjwt[crypto]>=2.10.1,<3",
    "rfc3339-validator>=0.1.4",
]

[tool.uv.sources]
# T36 intake is proposed in #168, not yet on develop. Consume its immutable
# source without copying the validator or merging another owner's branch.
bravo-observability = { git = "https://github.com/Softbank-Hackathon-Finals/platform.git", rev = "24b3cf516fdbdaac7dd346718eaac3c42f5e1d63", subdirectory = "services/observability" }
bravo-rehearsal-runner = { path = "../rehearsal-runner" }
bravo-agent-worker = { path = "../agent-worker" }
bravo-iac = { path = "../iac" }
bravo-control-gate = { path = "../control-gate" }
bravo-inventory = { path = "../inventory" }
bravo-apply-path = { path = "../apply-path", editable = true }
bravo-controls = { path = "../control-runner" }

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
sso-registration = ["boto3>=1.35,<2"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.9",
    "psycopg[binary]>=3.2,<4",
    {include-group = "product-inputs"},
    {include-group = "application-host"},
    {include-group = "target-controls"},
    {include-group = "security-governance"},
]
trusted-host = ["bravo-rehearsal-runner", {include-group = "security-governance"}]
product-inputs = ["bravo-agent-worker", "bravo-inventory", "bravo-iac", {include-group = "trusted-host"}]
application-host = ["bravo-apply-path", "bravo-control-gate==0.1.0"]
# boto3: the T19 platform signer calls AWS KMS with the pod web identity (ADR-0038).
gate-records = ["bravo-control-gate==0.1.0", "boto3>=1.35,<2"]
# ADR-0041: the workflow host measures the post-cutover target T14 run with the T14 collectors.
target-controls = ["bravo-controls[aws]"]
security-governance = ["sova-security==0.11.1"]

[tool.uv.sources.sova-security]
git = "https://github.com/Softbank-Hackathon-Finals/security.git"
rev = "d7f752b6ef9dec18f198d2e3760a08a1370f71ea"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bravo_platform_events"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../rehearsal-runner/testing"]
