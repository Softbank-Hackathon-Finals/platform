[project]
name = "bravo-platform-events"
version = "0.1.0"
description = "T10 SSE contract proposal and local replay adapter for T21/T24"
requires-python = ">=3.12"
dependencies = [
    "bravo-observability[api]",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "pyjwt[crypto]>=2.10.1,<3",
    "rfc3339-validator>=0.1.4",
]

[tool.uv.sources]
# T36 intake is proposed in #168, not yet on develop. Consume its immutable
# source without copying the validator or merging another owner's branch.
bravo-observability = { git = "https://github.com/Softbank-Hackathon-Finals/platform.git", rev = "020c6c78bdc6133ab0ee15e2a990bb9527b3182f", subdirectory = "services/observability" }
bravo-rehearsal-runner = { path = "../rehearsal-runner" }
bravo-control-gate = { path = "../control-gate" }

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8", "ruff>=0.9", "psycopg[binary]>=3.2,<4", {include-group = "trusted-host"}, "bravo-control-gate==0.1.0"]
trusted-host = ["bravo-rehearsal-runner"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bravo_platform_events"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../rehearsal-runner/testing"]
