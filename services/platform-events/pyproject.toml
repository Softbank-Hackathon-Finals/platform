[project]
name = "bravo-platform-events"
version = "0.1.0"
description = "T10 SSE contract proposal and local replay adapter for T21/T24"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "jsonschema>=4.23", "rfc3339-validator>=0.1.4"]

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8", "ruff>=0.9"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bravo_platform_events"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
