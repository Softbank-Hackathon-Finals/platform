include classpath("application.conf")
node-address { protocol = http, host = elasticmq, port = 9324, context-path = "" }
rest-sqs { enabled = true, bind-port = 9324, bind-hostname = "0.0.0.0", sqs-limits = strict }
rest-stats { enabled = false }
queues-storage { enabled = true, path = "/data/queues.conf" }
messages-storage { enabled = true, uri = "jdbc:h2:/data/elasticmq" }
queues {
  message-created-dlq { }
  slow-check-dlq { }
  # 시간 초과 시험용. 가시성 시간 2초 >= 함수 제한 시간 1초.
  slow-check {
    defaultVisibilityTimeout = 2 seconds
    deadLettersQueue { name = "slow-check-dlq", maxReceiveCount = 3 }
  }
  # 가시성 시간 10초 >= 함수 제한 시간 5초. 3번 실패하면 실패 보관 큐로 옮긴다.
  message-created {
    defaultVisibilityTimeout = 10 seconds
    deadLettersQueue { name = "message-created-dlq", maxReceiveCount = 3 }
  }
}
