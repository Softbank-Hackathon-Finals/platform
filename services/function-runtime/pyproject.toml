[project]
name = "bravo-function-runtime"
version = "0.1.0"
description = "SQS → Lambda 호환 런타임 (T46): 큐 메시지로 고치지 않은 Lambda 핸들러를 실행한다. LLM을 쓰지 않는다."
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
]

[project.scripts]
bravo-function-runtime = "bravo_function_runtime.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bravo_function_runtime"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# 줄 길이는 포매터가 맞춘다. 한국어 주석은 폭 계산이 길게 잡힌다.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
