[project]
name = "bravo-target-recommend"
version = "0.1.0"
description = "T32 이전 대상 추천: 규칙 적합성(불가는 제외) → 순위 → AI 순위는 스키마 검증, 규칙을 뒤집지 못함"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23,<5"]

[project.scripts]
bravo-recommend = "bravo_recommend.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "bravo-inventory"]

[tool.uv.sources]
# 시험 전용: 회귀 시험이 T16의 실제 `bravo-inventory scan` 출력을 입력으로 쓴다. 런타임 의존성이 아니다.
bravo-inventory = { path = "../inventory" }

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bravo_recommend"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
