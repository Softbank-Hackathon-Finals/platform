[project]
name = "bravo-iam-console"
version = "0.1.0"
description = "Keychain-backed initial IAM console profile helper"
requires-python = ">=3.12"
dependencies = ["boto3==1.40.65", "botocore==1.40.76"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
