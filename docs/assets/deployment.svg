<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" font-family="IBM Plex Sans KR, Noto Sans CJK KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" role="img" aria-label="배치도: AWS 단일 계정에 출발지 VPC와 플랫폼 VPC, 계정 안의 감사 로그가 있고, 온프렘에 목적지 RKE2와 리허설 네임스페이스가 있다. 사용자는 Cloudflare를 거쳐 양쪽 앱에 닿고, 이미지는 GitHub Actions가 빌드해 GHCR에서 양쪽이 받아 간다. 두 DB는 Tailscale로 논리 복제하고, 컷오버 전에는 목적지 앱도 출발지 DB에 쓴다.">
<defs>
