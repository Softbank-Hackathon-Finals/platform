name: ci

# PR · main push마다 도는 검사. job 이름(secrets · infra · platform)은 main ruleset의 필수 검사라 바꾸지 않는다.
# 경로 필터를 두지 않는다. 워크플로가 건너뛰어지면 필수 검사 결과가 오지 않아 머지가 막힌다.
# 검사할 대상이 없으면 그 단계만 건너뛰고 job은 통과한다.
# 예외는 레포 루트의 .gitleaks.toml · .trivyignore에 사유 주석과 함께 적는다.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  TF_VERSION: "1.16.5"
# 대상 파일은 git ls-files로 찾는다. 커밋된 파일만 보므로 node_modules · .venv · .terraform은 저절로 빠진다.

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: PR 제목 형식 ([T번호] · [setup] · [sync])
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$TITLE" =~ ^\[(T[0-9]+|setup|sync)\]\  ]]; then
            echo "::error::PR 제목은 [T번호]로 시작한다. 예: [T3] 리허설 네임스페이스 템플릿 추가"
            exit 1
          fi
      - name: 시크릿 유출 검사 (gitleaks, 전체 이력)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3 \
            detect --source /repo --redact --verbose

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: 워크플로 문법 (actionlint)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
      - name: Dockerfile (hadolint)
        run: |
          mapfile -t files < <(git ls-files ':(glob)**/Dockerfile' ':(glob)**/*.Dockerfile')
          [ ${#files[@]} -gt 0 ] || { echo "Dockerfile 없음, 건너뜀"; exit 0; }
          for f in "${files[@]}"; do
            echo "::group::$f"
            docker run --rm -i hadolint/hadolint:v2.12.0 hadolint --failure-threshold warning - < "$f"
            echo "::endgroup::"
          done
      - name: Terraform 파일 확인
        id: tf
        run: |
          dirs=$(git ls-files ':(glob)**/*.tf' | xargs -r -n1 dirname | sort -u)
          if [ -z "$dirs" ]; then echo "Terraform 없음, 건너뜀"; exit 0; fi
          { echo "dirs<<EOF"; echo "$dirs"; echo "EOF"; } >> "$GITHUB_OUTPUT"
      - if: steps.tf.outputs.dirs != ''
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Terraform fmt · validate
        if: steps.tf.outputs.dirs != ''
        env:
          DIRS: ${{ steps.tf.outputs.dirs }}
        run: |
          terraform fmt -check -recursive
          while read -r d; do
            echo "::group::$d"
            terraform -chdir="$d" init -backend=false -input=false >/dev/null
            terraform -chdir="$d" validate
            echo "::endgroup::"
          done <<< "$DIRS"
      - name: IaC 설정 검사 (Trivy config)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore

  platform:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # 프로젝트 파일(pyproject.toml · package.json · go.mod)이 있는 폴더마다 해당 언어 검사를 돌린다.
      # 새 언어를 쓰게 되면 여기에 감지 규칙을 한 줄 추가한다. 필수 검사 이름은 그대로 둔다.
      - name: 프로젝트 감지
        id: detect
        run: |
          find_dirs() { git ls-files ":(glob)**/$1" | xargs -r -n1 dirname | sort -u; }
          for kind in python:pyproject.toml node:package.json go:go.mod; do
            dirs=$(find_dirs "${kind#*:}")
            echo "${kind%%:*}: ${dirs:-없음}" | tr '\n' ' '; echo
            { echo "${kind%%:*}<<EOF"; echo "$dirs"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          done

      - if: steps.detect.outputs.python != ''
        uses: astral-sh/setup-uv@v10.2.0
      - name: Python (ruff · pytest)
        if: steps.detect.outputs.python != ''
        env:
          DIRS: ${{ steps.detect.outputs.python }}
        run: |
          while read -r d; do
            echo "::group::$d"
            (
              cd "$d"
              if [ -f uv.lock ]; then uv sync --frozen; else uv sync; fi
              uvx ruff check .
              # 테스트 파일이 있을 때만 (없으면 pytest가 실패 코드 5를 낸다)
              if git ls-files ':(glob)**/test_*.py' ':(glob)**/*_test.py' | grep -q .; then
                uv run --with pytest pytest
              fi
            )
            echo "::endgroup::"
          done <<< "$DIRS"

      - if: steps.detect.outputs.node != ''
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Node (lint · test · build)
        if: steps.detect.outputs.node != ''
        env:
          DIRS: ${{ steps.detect.outputs.node }}
        run: |
          corepack enable
          while read -r d; do
            echo "::group::$d"
            (
              cd "$d"
              if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install; fi
              pnpm run --if-present lint
              pnpm run --if-present test
              pnpm run --if-present build
            )
            echo "::endgroup::"
          done <<< "$DIRS"

      - if: steps.detect.outputs.go != ''
        uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Go (vet · test)
        if: steps.detect.outputs.go != ''
        env:
          DIRS: ${{ steps.detect.outputs.go }}
        run: |
          while read -r d; do
            echo "::group::$d"
            (cd "$d" && go vet ./... && go test ./...)
            echo "::endgroup::"
          done <<< "$DIRS"

      - name: 오픈소스 취약점 검사 (Trivy fs)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
