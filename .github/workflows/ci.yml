name: ci

# Required gates always report. Scope chooses work inside them, never skips the workflow.
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main, develop]
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TF_VERSION: "1.16.5"

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.plan.outputs.full }}
      infra: ${{ steps.plan.outputs.infra }}
      scripts: ${{ steps.plan.outputs.scripts }}
      projects: ${{ steps.plan.outputs.projects }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scope regression tests
        run: python3 -m unittest discover -s scripts/tests -p test_ci_scope.py -v
      - name: Plan affected checks
        id: plan
        env:
          BASE: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}
          GROUP_HEAD: ${{ github.event.merge_group.head_sha }}
          GROUP_ACTION: ${{ github.event.action }}
        run: |
          if [ "$EVENT" = merge_group ]; then
            # A queue result must describe this exact checkout and the entire group.
            if [[ "$GROUP_ACTION" != checks_requested || ! "$BASE" =~ ^[0-9a-f]{40}$ || ! "$GROUP_HEAD" =~ ^[0-9a-f]{40}$ ]]; then
              echo '::error::Invalid merge group metadata'
              exit 1
            fi
            if [[ "$(git rev-parse HEAD)" != "$GROUP_HEAD" ]] || ! git merge-base --is-ancestor "$BASE" "$GROUP_HEAD"; then
              echo '::error::Merge group checkout/base mismatch'
              exit 1
            fi
            # base_sha can be the previous queue group, so its diff omits earlier PRs.
            python3 scripts/ci_scope.py --full > ci-plan.json
          elif [ "$EVENT" = pull_request ]; then
            python3 scripts/ci_scope.py --base "$BASE" > ci-plan.json
          else
            python3 scripts/ci_scope.py --full > ci-plan.json
          fi
          cat ci-plan.json >> "$GITHUB_STEP_SUMMARY"

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: PR 제목 형식 ([T번호] · [setup] · [sync])
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$TITLE" =~ ^\[(T[0-9]+|setup|sync)\]\  ]]; then
            echo "::error::PR 제목은 [T번호]로 시작한다. 예: [T3] 리허설 네임스페이스 템플릿 추가"
            exit 1
          fi
      - name: 시크릿 유출 검사 (병합 커밋의 전체 조상 이력)
        run: |
          python3 scripts/ci_secrets.py --scope head --receipt "$RUNNER_TEMP/secret-scan.json"
      - name: 실제 scanner 경계 회귀
        env:
          BRAVO_TEST_GITLEAKS: docker
        run: python3 -m unittest discover -s scripts/tests -p test_ci_secrets.py -v
      - name: 증빙 소스 해시 형식
        env:
          EVIDENCE_BASE: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: python3 scripts/evidence_sources.py check --base "$EVIDENCE_BASE"
      - name: 공개 파일 개인정보·운영 식별자 검사
        run: python3 scripts/public_evidence.py check
      - name: 검사 입력 기록
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/secret-scan.json
          retention-days: 14

  infra:
    needs: scope
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require valid scope
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
        run: test "$SCOPE_RESULT" = success
      - uses: actions/checkout@v7
        if: needs.scope.outputs.infra == 'true'
        with:
          fetch-depth: 0
      - name: Registration promotion source
        if: needs.scope.outputs.infra == 'true'
        run: |
          python3 scripts/registration_delivery.py check-promotion
          python3 scripts/registration_delivery.py check-promotion --service product-reader
      - name: Workflow syntax
        if: needs.scope.outputs.infra == 'true'
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
      - name: Dockerfiles
        if: needs.scope.outputs.infra == 'true'
        run: |
          while IFS= read -r -d '' file; do
            docker run --rm -i hadolint/hadolint:v2.12.0 hadolint --failure-threshold warning - < "$file"
          done < <(git ls-files -z ':(glob)**/Dockerfile' ':(glob)**/*.Dockerfile')
      - name: Registration Helm contract
        if: needs.scope.outputs.infra == 'true'
        run: |
          curl --fail --silent --show-error --location https://get.helm.sh/helm-v4.0.0-linux-amd64.tar.gz -o "$RUNNER_TEMP/helm.tgz"
          curl --fail --silent --show-error --location https://get.helm.sh/helm-v4.0.0-linux-amd64.tar.gz.sha256sum -o "$RUNNER_TEMP/helm.sha256"
          (cd "$RUNNER_TEMP" && sed 's/helm-v4.0.0-linux-amd64.tar.gz/helm.tgz/' helm.sha256 | sha256sum --check)
          tar -xzf "$RUNNER_TEMP/helm.tgz" -C "$RUNNER_TEMP" linux-amd64/helm
          export PATH="$RUNNER_TEMP/linux-amd64:$PATH"
          python3 -m venv "$RUNNER_TEMP/helm-test"
          "$RUNNER_TEMP/helm-test/bin/pip" install pyyaml==6.0.3 cel-python==0.2.0
          helm repo add bravo-argo https://argoproj.github.io/argo-helm --force-update
          helm dependency build infra/gitops/argocd
          "$RUNNER_TEMP/helm-test/bin/python" infra/gitops/test_registration_chart.py
          "$RUNNER_TEMP/helm-test/bin/python" infra/gitops/test_product_reader_chart.py
          "$RUNNER_TEMP/helm-test/bin/python" infra/gitops/test_initial_proposal_chart.py
          "$RUNNER_TEMP/helm-test/bin/python" infra/envs/rehearsal-access/test_exec_guard.py
          # The same guard on a real API server (throwaway k3s in Docker, server dry-run + exec).
          "$RUNNER_TEMP/helm-test/bin/python" infra/envs/rehearsal-access/apiserver_exec_guard.py
          "$RUNNER_TEMP/helm-test/bin/python" infra/gitops/test_bootstrap.py
          mkdir "$RUNNER_TEMP/registration-rendered"
          "$RUNNER_TEMP/helm-test/bin/python" infra/gitops/test_registration_chart.py --render > "$RUNNER_TEMP/registration-rendered/registration.yaml"
          "$RUNNER_TEMP/helm-test/bin/python" infra/gitops/test_product_reader_chart.py --render > "$RUNNER_TEMP/registration-rendered/product-reader.yaml"
          helm template bravo-gitops infra/gitops/argocd --namespace bravo-gitops --kube-version 1.35.9 > "$RUNNER_TEMP/registration-rendered/argocd.yaml"
      - name: Rendered registration security
        if: needs.scope.outputs.infra == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ runner.temp }}/registration-rendered/registration.yaml
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Terraform directories
        id: tf
        if: needs.scope.outputs.infra == 'true'
        run: |
          dirs=$(git ls-files ':(glob)**/*.tf' | xargs -r -n1 dirname | sort -u)
          if [ -n "$dirs" ]; then
            { echo "dirs<<EOF"; echo "$dirs"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          fi
      - if: steps.tf.outputs.dirs != ''
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Terraform fmt, validate and mock tests
        if: steps.tf.outputs.dirs != ''
        env:
          DIRS: ${{ steps.tf.outputs.dirs }}
        run: |
          terraform fmt -check -recursive
          while read -r d; do
            echo "::group::$d"
            terraform -chdir="$d" init -backend=false -input=false >/dev/null
            terraform -chdir="$d" validate
            terraform -chdir="$d" test -no-color
            echo "::endgroup::"
          done <<< "$DIRS"
      - name: IaC security
        if: needs.scope.outputs.infra == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore.yaml
      - name: Unaffected infrastructure
        if: needs.scope.outputs.infra == 'false'
        run: echo 'No infrastructure change; scope was validated.'

  project-checks:
    needs: scope
    if: needs.scope.outputs.projects != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - if: matrix.kind == 'python'
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: ${{ matrix.path }}/uv.lock
      - if: matrix.kind == 'node'
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - if: matrix.kind == 'node'
        run: corepack enable
      - if: matrix.kind == 'go'
        uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Check project
        env:
          PROJECT_PATH: ${{ matrix.path }}
          PROJECT_KIND: ${{ matrix.kind }}
        run: python3 scripts/ci_project.py "$PROJECT_PATH" "$PROJECT_KIND"
      - name: Project dependencies
        if: needs.scope.outputs.full != 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ matrix.path }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore.yaml

  platform:
    needs: [scope, project-checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require all selected projects to succeed
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          PROJECT_RESULT: ${{ needs.project-checks.result }}
          PROJECTS: ${{ needs.scope.outputs.projects }}
        run: |
          test "$SCOPE_RESULT" = success
          if [ "$PROJECTS" = '[]' ]; then
            test "$PROJECT_RESULT" = skipped
          else
            test "$PROJECT_RESULT" = success
          fi
      - uses: actions/checkout@v7
        if: needs.scope.outputs.scripts == 'true' || needs.scope.outputs.full == 'true'
      - name: Repository tools
        if: needs.scope.outputs.scripts == 'true'
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Repository-wide dependency scan (full runs)
        if: needs.scope.outputs.full == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore.yaml

  # 필수 검사가 아니다. 경고만 남기고 머지를 막지 않는다(오타 · 실측값 수정은 버전을 올리지 않는 게 맞다).
  design-doc:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 설계 문서 버전 표기 확인 (경고만)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          doc=docs/design.html
          git diff --quiet "$BASE"...HEAD -- "$doc" && { echo "설계 문서 변경 없음"; exit 0; }
          ver() { grep -oP '<dt>상태</dt><dd>[^<]*\K v[0-9.]+(?=</dd>)' | tr -d ' '; }
          old=$(git show "$BASE:$doc" | ver); new=$(ver < "$doc")
          if [ "$old" = "$new" ]; then
            line=$(grep -n '<dt>상태</dt>' "$doc" | cut -d: -f1)
            echo "::warning file=$doc,line=${line:-1},title=설계 문서 버전 그대로 ($new)::설계 문서가 바뀌었는데 버전이 $new 그대로다. 오타 · 실측값 같은 작은 수정이면 무시한다. 아키텍처 · 시나리오 · 범위 · 요구사항 변경이면 scripts/design-bump.sh <새 버전>으로 버전을 올린다 (docs/design-history/README.md)."
          else
            echo "버전 $old → $new"
            [ -f "docs/design-history/design-$old.html" ] || echo "::warning file=$doc,title=이전 버전 사본 없음::버전이 $old → $new로 바뀌었는데 docs/design-history/design-$old.html이 없다. scripts/design-bump.sh로 올리면 사본이 생긴다."
          fi
