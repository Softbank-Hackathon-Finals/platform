name: publish-function-runtime-image

# T46 호환 런타임 베이스 이미지(ADR-0045). 한 번 빌드한 OCI 바이트를 검사한 뒤 그 바이트를 그대로 올린다.
# 출처 증명(provenance) · SBOM은 buildx가 같은 OCI 인덱스에 넣는다(다른 발행 워크플로와 같다).
# 핸들러를 얹은 함수 이미지는 핸들러가 있는 앱 레포가 이 베이스의 digest 위에 만든다.
# 아직 배포처가 없어 digest를 고정하는 PR은 만들지 않는다. 배포할 때 이 실행의 digest를 쓴다(태그를 배포하지 않는다).
on:
  push:
    branches: [develop]
    paths:
      - services/function-runtime/src/**
      - services/function-runtime/pyproject.toml
      - services/function-runtime/uv.lock
      - services/function-runtime/Dockerfile
      - services/function-runtime/.dockerignore
      - .github/workflows/publish-function-runtime-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: function-runtime-image-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    env:
      SOURCE_SHA: ${{ github.workflow_sha }}
      IMAGE: ghcr.io/softbank-hackathon-finals/platform-function-runtime
    steps:
      - name: Choose the OCI layout path
        run: echo "LAYOUT=$RUNNER_TEMP/function-runtime/image-layout" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the OCI artifact once
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/function-runtime
          platforms: linux/amd64
          outputs: type=oci,dest=${{ env.LAYOUT }},tar=false
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/Softbank-Hackathon-Finals/platform
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
          tags: platform-function-runtime:sha-${{ env.SOURCE_SHA }}
      - name: Scan before registry login
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          input: ${{ env.LAYOUT }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          timeout: 10m
      - name: Install registry copy tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the scanned bytes and check the digest
        id: publish
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          skopeo copy --all --preserve-digests "oci:$LAYOUT" "docker://$IMAGE:sha-$SOURCE_SHA"
          remote=$(skopeo inspect --raw "docker://$IMAGE:sha-$SOURCE_SHA" | sha256sum | cut -d' ' -f1)
          test "sha256:$remote" = "$BUILD_DIGEST"
          echo "digest=$BUILD_DIGEST" >> "$GITHUB_OUTPUT"
          echo "### $IMAGE@$BUILD_DIGEST (source $SOURCE_SHA)" >> "$GITHUB_STEP_SUMMARY"
