name: sync-tasks

# 진행 상황의 기준은 보드(이슈)다.
# - tasks.md가 develop에 들어오면(push): 계획(작업 · 할 일 문장 · 우선순위)을 이슈에 반영. 체크 상태는 이슈 것을 유지
# - 이슈가 바뀌면(issues): 체크 상태로 보드를 옮기고, 체크 · 담당을 tasks.md에 반영하는 PR을 만들고 리뷰 대기
# 보드를 옮기면 Slack 채널에 알린다(SLACK_BOT_TOKEN, SLACK_CHANNEL_ID가 있을 때).
on:
  push:
    branches: [develop]
    paths: [docs/tasks.md, scripts/sync_tasks.py]
  issues:
    types: [edited, closed, reopened, assigned, unassigned]
  pull_request_target:
    branches: [develop]
    types: [opened, reopened, closed, ready_for_review, converted_to_draft, synchronize, edited, review_requested, review_request_removed]
  pull_request_review:
    types: [submitted, dismissed]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      command:
        type: choice
        options: [pull, push, status, prs]
        default: pull
      dry-run:
        type: boolean
        default: false
      slack-test:
        description: Slack 연결 확인용 테스트 메시지를 보낸다
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-tasks
  cancel-in-progress: false

env:
  # 조직 프로젝트 쓰기와, CI를 실행시키는 PR을 만들려면 기본 토큰 대신 PAT이 필요하다.
  GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PROJECT_TOKEN }}
          # PR/review events always execute trusted develop code, never a PR head.
          # Manual dispatch uses the explicitly selected branch for pre-merge verification.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || 'develop' }}
          persist-credentials: false
      - name: 동기화
        id: sync
        shell: bash  # pipefail: 스크립트가 실패하면 tee 뒤에서도 job이 실패한다
        env:
          COMMAND: ${{ github.event_name == 'push' && 'push' || (github.event_name == 'pull_request_target' || github.event_name == 'pull_request_review' || github.event_name == 'schedule') && 'prs' || inputs.command || 'pull' }}
          DRY: ${{ inputs.dry-run && '--dry-run' || '' }}
        run: |
          python3 scripts/sync_tasks.py "$COMMAND" ${DRY:+"$DRY"} --moves-file moves.txt | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -z "$DRY" ] && ! git diff --quiet docs/tasks.md; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: tasks.md 반영 PR (리뷰 대기)
        if: steps.sync.outputs.changed == 'true'
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c bot/sync-tasks
          git commit -qam "[sync] 보드의 체크 · 담당을 tasks.md에 반영"
          git push -qf origin bot/sync-tasks
          gh pr view bot/sync-tasks --json state -q .state 2>/dev/null | grep -q OPEN \
            || gh pr create --base develop --head bot/sync-tasks --title "[sync] 보드 → tasks.md" \
                 --body "이슈의 할 일 체크와 담당을 tasks.md에 반영한다. sync-tasks 워크플로가 만들었다."
          echo "봇 PR도 필수 CI와 팀원 리뷰 승인 후 머지한다. 자동 머지는 예약하지 않는다."
      - name: Slack 테스트 메시지
        if: inputs.slack-test
        run: echo "Slack 연결 테스트 (보드 동기화 알림이 이 채널로 온다)" >> moves.txt
      - name: Slack 알림
        if: hashFiles('moves.txt') != ''
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          CHANNEL: ${{ vars.SLACK_CHANNEL_ID }}
        run: |
          if [ -z "$SLACK_TOKEN" ] || [ -z "$CHANNEL" ]; then echo "Slack 설정 없음, 건너뜀"; exit 0; fi
          text="$(printf '*보드 이동* (by %s)\n%s\n<https://github.com/orgs/%s/projects/2|보드 열기>' \
            "${{ github.actor }}" "$(sed 's/^/• /' moves.txt)" "${{ github.repository_owner }}")"
          res=$(jq -n --arg c "$CHANNEL" --arg t "$text" '{channel:$c,text:$t}' \
            | curl -sS -X POST https://slack.com/api/chat.postMessage \
                -H "Authorization: Bearer $SLACK_TOKEN" -H "Content-Type: application/json; charset=utf-8" -d @-)
          # 실패하면 Slack이 돌려준 오류 코드를 남긴다 (not_in_channel: 비공개 채널에 앱 초대 필요, invalid_auth: 토큰 확인, channel_not_found: 채널 ID 확인)
          if [ "$(jq -r .ok <<<"$res")" != true ]; then echo "::warning::Slack 전송 실패: $(jq -r '.error // "응답 없음"' <<<"$res")"; fi
