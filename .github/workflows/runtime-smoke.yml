name: runtime-smoke

# Explicit opt-in. Normal PR checks do not start cloud resources or run this job.
on:
  workflow_dispatch:
  push:
    branches: [feature/T7-rke2-oidc]
    paths: [.github/workflows/runtime-smoke.yml]

permissions:
  contents: read

concurrency:
  group: platform-runtime-smoke
  cancel-in-progress: false

jobs:
  oidc-rke2:
    if: vars.BRAVO_RUNTIME_SMOKE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Short-lived AWS session
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ secrets.BRAVO_RUNTIME_SMOKE_ROLE_ARN }}
          aws-region: ap-northeast-2
          role-duration-seconds: 900
          mask-aws-account-id: true
      - name: Fixed namespace deployment and denial checks
        env:
          INSTANCE_ID: ${{ secrets.BRAVO_RUNTIME_SMOKE_INSTANCE_ID }}
          DOCUMENT: bravo-platform-runtime-smoke
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          command_id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name "$DOCUMENT" --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$INSTANCE_ID"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text > result.json
          python3 - <<'PY'
          import json
          with open('result.json') as result_file:
              result = json.load(result_file)
          expected = {'rke2_ready', 'namespace_deploy', 'secret_denied', 'other_namespace_denied'}
          assert set(result) == expected and all(value is True for value in result.values())
          print(json.dumps(result, sort_keys=True))
          PY
      - name: Prove arbitrary shell document is denied
        env:
          INSTANCE_ID: ${{ secrets.BRAVO_RUNTIME_SMOKE_INSTANCE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript --parameters '{"commands":["true"]}' \
            > forbidden.json 2> forbidden.err; then
            echo '::error::Unexpected arbitrary shell permission'
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          assert '(AccessDeniedException)' in Path('forbidden.err').read_text()
          print('arbitrary_shell_denied=true')
          PY
