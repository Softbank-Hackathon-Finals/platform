# Reviewed exceptions apply only to these files, never the whole repository.
misconfigurations:
  - id: AVD-KSV-0056
    paths:
      - infra/gitops/argocd/templates/registration-rbac.yaml
    statement: T43 controller manages only the named t10-registration Service. Named update/delete RBAC plus fail-closed ValidatingAdmissionPolicy constrain create to that name and ClusterIP; no NodePort or LoadBalancer. Controller cannot modify the admission policy.
  - id: AVD-KSV-0053
    paths:
      - services/rehearsal-runner/templates/20-rbac.yaml
    statement: Namespace-scoped rehearsal.exec only; restricted Pods, tokenless workloads and isolation tests enforce ADR-0003.
  - id: AVD-KSV-0056
    paths:
      - services/rehearsal-runner/templates/20-rbac.yaml
    statement: Rehearsal app Services only; ResourceQuota forbids NodePort and LoadBalancer (N11).
  - id: AVD-AWS-0104
    paths:
      - infra/envs/ci-validation-aws/main.tf
    expired_at: 2026-11-10
    statement: Ephemeral SSM-only validation host needs HTTPS bootstrap; inbound is empty, lifetime <=90min, no production routes or credentials. Workload egress is separately default-deny and live-tested. Remove/review before reuse after expiry.
  - id: AVD-AWS-0104
    paths:
      - infra/envs/loadgen-aws/main.tf
    expired_at: 2026-11-30
    statement: Load generator must reach Cloudflare Edge, SSM, package hosts and Tailscale on addresses that change; outbound is TCP 443 only, inbound is empty and tested, and the VPC peers with nothing. Remove with the stack after the demo.
  - id: AVD-AWS-0104
    paths:
      - infra/envs/tailnet-relay/main.tf
    expired_at: 2026-11-30
    statement: The Tailscale peer relay forwards UDP to peers' NAT-assigned ports and reaches Tailscale control, DERP and SSM on addresses that change; who may relay is the tailnet grant. Inbound is the relay UDP port only, the host has no SSH key and holds no credentials, and the VPC peers with nothing. Remove with the stack after the demo.
  - id: AVD-AWS-0104
    paths:
      - infra/envs/sandbox-session/main.tf
    expired_at: 2026-11-30
    statement: Agent sandbox Docker host needs TCP 443 to dnf mirrors, the registry for digest-pinned images and SSM, whose addresses change. Sandbox containers run with network_mode none and cannot use it; inbound is the platform node /32 on Docker mTLS only; no public IP. Restrict to VPC endpoints or remove with the stack after the demo.
  - id: AVD-AWS-0087
    paths:
      - infra/envs/oidc-issuer/main.tf
    statement: T48 public OIDC issuer. Tailscale must read each cluster's discovery document and public keys anonymously; the bucket policy opens exactly those two objects per environment (pinned by terraform test), object ACLs stay blocked, and the keys come from Git with a precondition that refuses private members.
  - id: AVD-AWS-0093
    paths:
      - infra/envs/oidc-issuer/main.tf
    statement: T48 public OIDC issuer. Same two anonymous-read objects per environment as AVD-AWS-0087; nothing else in the bucket is public and non-TLS access is denied.
  - id: AVD-AWS-0132
    paths:
      - infra/envs/oidc-issuer/main.tf
    statement: T48 public OIDC issuer. Anonymous readers cannot use a KMS key, so the public discovery and JWKS objects use SSE-S3; the bucket holds no secret (public keys only).
  - id: AVD-KSV-0056
    paths:
      - infra/iac/operators/source-dev/operator.yaml
    statement: T48 Tailscale operator (upstream chart 1.104.4, sha256-pinned render). It must create and update Services, Endpoints, EndpointSlices and NetworkPolicies for the proxies it runs; this is the RBAC already running on the source cluster, taken over by GitOps unchanged.
  - id: AVD-KSV-0014
    paths:
      - infra/iac/operators/source-dev/operator.yaml
    expired_at: 2026-11-30
    statement: T48 upstream chart default container securityContext, taken over as it runs on the source cluster (only the API proxy mode changes). Hardening through operatorConfig.securityContext restarts the operator and is its own reviewed change.
  - id: AVD-KSV-0118
    paths:
      - infra/iac/operators/source-dev/operator.yaml
    expired_at: 2026-11-30
    statement: T48 upstream chart default pod and container securityContext, taken over unchanged from the running source operator. Hardening is a separate reviewed change before the expiry.
