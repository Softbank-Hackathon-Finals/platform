# Reviewed exceptions apply only to these files, never the whole repository.
misconfigurations:
  - id: AVD-KSV-0056
    paths:
      - infra/gitops/argocd/templates/registration-rbac.yaml
    statement: T43 controller manages only the named t10-registration Service. Named update/delete RBAC plus fail-closed ValidatingAdmissionPolicy constrain create to that name and ClusterIP; no NodePort or LoadBalancer. Controller cannot modify the admission policy.
  - id: AVD-KSV-0053
    paths:
      - services/rehearsal-runner/templates/20-rbac.yaml
    statement: Namespace-scoped rehearsal.exec only; restricted Pods, tokenless workloads and isolation tests enforce ADR-0003.
  - id: AVD-KSV-0056
    paths:
      - services/rehearsal-runner/templates/20-rbac.yaml
    statement: Rehearsal app Services only; ResourceQuota forbids NodePort and LoadBalancer (N11).
  - id: AVD-AWS-0104
    paths:
      - infra/envs/ci-validation-aws/main.tf
    expired_at: 2026-11-10
    statement: Ephemeral SSM-only validation host needs HTTPS bootstrap; inbound is empty, lifetime <=90min, no production routes or credentials. Workload egress is separately default-deny and live-tested. Remove/review before reuse after expiry.
  - id: AVD-AWS-0104
    paths:
      - infra/envs/loadgen-aws/main.tf
    expired_at: 2026-11-30
    statement: Load generator must reach Cloudflare Edge, SSM, package hosts and Tailscale on addresses that change; outbound is TCP 443 only, inbound is empty and tested, and the VPC peers with nothing. Remove with the stack after the demo.
