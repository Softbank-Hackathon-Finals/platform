# Destination Argo CD (ADR-0032 3.5). Owned by the destination cluster, not the platform:
# no UI, Dex, admin account or exec. Cluster-scoped because the stack creates Namespaces,
# PersistentVolumes and operator CRDs. Automatic prune stays off in every Application.
argo-cd:
  fullnameOverride: target-gitops
  createClusterRoles: true
  crds:
    install: true
    keep: true
  global:
    image:
      tag: v3.6.1
    securityContext:
      runAsNonRoot: true
      runAsUser: 999
      runAsGroup: 999
      fsGroup: 999
      seccompProfile:
        type: RuntimeDefault
  configs:
    cm:
      admin.enabled: false
      exec.enabled: false
      timeout.reconciliation: 60s
      timeout.reconciliation.jitter: 15s
      application.resourceTrackingMethod: annotation
  controller:
    resources:
      requests: {cpu: 200m, memory: 512Mi}
      limits: {cpu: "1", memory: 1Gi}
  repoServer:
    automountServiceAccountToken: false
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "1", memory: 768Mi}
  redis:
    resources:
      requests: {cpu: 50m, memory: 96Mi}
      limits: {cpu: 250m, memory: 256Mi}
  server:
    enabled: false
  dex:
    enabled: false
  applicationSet:
    replicas: 0
  redisSecretInit:
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 200m, memory: 256Mi}
  notifications:
    enabled: false
