# Applied by the platform cluster operator before enabling the GitOps application.
# The service account has no other Kubernetes API permission.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-security-review-tokenreview
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-security-review-tokenreview
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: platform-security-review-tokenreview
subjects:
  - kind: ServiceAccount
    name: security-review
    namespace: platform-state
