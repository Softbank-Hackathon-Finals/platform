# T7 install step for the T15 rehearsal host (infra/charts/rehearsal-host).
# GitOps does not manage NetworkPolicy, so the operator applies both objects with
# the other T7 tailnet policies. platform-state is default-deny; DB egress comes
# from the existing runtime-database policy via bravo.dev/db-client=runtime.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: t15-rehearsal-host-target-api
  namespace: platform-state
  labels:
    app.kubernetes.io/name: t15-rehearsal-host
    component: platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: t15-rehearsal-host
      bravo.dev/target-api-client: rehearsal
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    # Tailscale egress Services forward 443 to a per-Service port on the proxy Pods (e.g. 10193, 10630),
    # and NetworkPolicy matches that Pod port; so the proxy group is the boundary, not a port number.
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: tailscale-system}
          podSelector:
            matchLabels:
              tailscale.com/managed: "true"
              tailscale.com/parent-resource: bravo-rehearsal-egress
              tailscale.com/parent-resource-type: proxygroup
    # The operator approval API reads and submits cutovers on the Cutover Executor (read + command token).
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: bravo-platform}
          podSelector:
            matchLabels: {app.kubernetes.io/name: cutover-executor}
      ports:
        - {port: 8080, protocol: TCP}
    # Evidence evaluation is an additional condition only. The review Service has no execution credential.
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: platform-state}
          podSelector:
            matchLabels: {app.kubernetes.io/name: security-review}
      ports:
        - {port: 8443, protocol: TCP}
    # T17 FailbackEdge and the in-Pod SHIFT CLI call api.cloudflare.com (resolved 2026-11-07 into
    # 104.19.192.0/22). Only the two published Cloudflare ranges that serve the API, port 443.
    - to:
        - ipBlock: {cidr: 104.16.0.0/13}
        - ipBlock: {cidr: 172.64.0.0/13}
      ports:
        - {port: 443, protocol: TCP}
    # Operator SSO proofs are checked against regional STS (sts.ap-northeast-2.amazonaws.com).
    # Same pinned address as t10-registration-trusted-egress; re-resolve when either changes.
    # The host chart pins sts.ap-northeast-2.amazonaws.com to this address via hostAliases and
    # bootstrap.py refuses a runtime whose pin differs. Keep the next line as the marker.
    # STS pin
    - to:
        - ipBlock: {cidr: 43.202.75.96/32}
      ports:
        - {port: 443, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: security-review-from-rehearsal-host
  namespace: platform-state
  labels:
    app.kubernetes.io/name: t15-rehearsal-host
    component: platform
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: security-review}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: t15-rehearsal-host}
      ports:
        - {port: 8443, protocol: TCP}
---
# Same egress proxy as bravo-rehearsal-control/rehearsal-host; added beside rehearsal-proxy-ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: t15-rehearsal-host-proxy-ingress
  namespace: tailscale-system
  labels:
    app.kubernetes.io/name: t15-rehearsal-host
    component: platform
spec:
  podSelector:
    matchLabels:
      tailscale.com/managed: "true"
      tailscale.com/parent-resource: bravo-rehearsal-egress
      tailscale.com/parent-resource-type: proxygroup
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: platform-state}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: t15-rehearsal-host
              bravo.dev/target-api-client: rehearsal
---
# The Executor accepts the approval host beside the workflow host (cutover-executor-from-workflow-host).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cutover-executor-from-rehearsal-host
  namespace: bravo-platform
  labels:
    app.kubernetes.io/name: t15-rehearsal-host
    component: platform
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: cutover-executor}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: platform-state}
          podSelector:
            matchLabels: {app.kubernetes.io/name: t15-rehearsal-host}
      ports:
        - {port: 8080, protocol: TCP}
