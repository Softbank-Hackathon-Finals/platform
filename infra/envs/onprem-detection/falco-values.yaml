# T33 온프렘 런타임 탐지: Falco 9.2.2(app 0.45.2), 차트 sha256 b8a1aa984c3d513ab1639be760e6a07a9eb203d4da77a45a1512d382b6d3687d
# 목적지 노드(arm64, 커널 6.8)는 modern eBPF로 커널 모듈 없이 동작한다.
# 경보는 falcosidekick이 플랫폼 수집 API(POST /v1/security/webhooks/falco/env-onprem)로 바깥 방향으로만 보낸다.
# 주소와 인증 헤더는 값이 아니라 Secret falcosidekick-bravo에 둔다(README 3단계, stdin으로 생성).
# 이미지는 태그와 multi-arch index digest로 고정한다(11-08, linux/arm64 포함). 차트가 tag 뒤에 그대로 붙인다
image: {tag: "0.45.2@sha256:1562a643953f938e02f47319b5214d93a235f11f646d60e9b8a516fd5a64698e"}
driver:
  kind: modern_ebpf
tty: false
resources:
  requests: {cpu: 50m, memory: 256Mi}
  limits: {memory: 512Mi}
falco:
  json_output: true
  # 경보는 falcosidekick으로만 보낸다. Pod 로그에 명령행이 든 경보 원문을 남기지 않는다
  stdout_output:
    enabled: false
  # 문자열 출력에는 명령행 등이 들어간다. 플랫폼 정규화기는 허용 필드만 남기지만, 보내는 쪽도 notice 이상만 보낸다
  priority: notice
falcosidekick:
  enabled: true
  replicaCount: 1
  image: {tag: "2.35.1@sha256:a9bb60d2c7742febd912315ca1155839abc0199bf322c58d3adbb8b0849fadb9"}
  webui:
    enabled: false
  config:
    existingSecret: falcosidekick-bravo
    # 플랫폼 사설 CA(비밀 아님). 서버 이름은 bravo-findings.bravo-security.svc(T44 목적지 egress Service)
    tlsclient:
      cacertfile: /etc/bravo-findings-ca/ca.crt
  extraVolumes:
    - name: bravo-findings-ca
      configMap: {name: bravo-findings-ca}
  extraVolumeMounts:
    - {name: bravo-findings-ca, mountPath: /etc/bravo-findings-ca, readOnly: true}
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}
# 규칙은 설치 때 한 번 받는다. 실행 중에 인터넷에서 새 규칙을 받아 권한 있는 Pod에 적용하지 않는다
falcoctl:
  artifact:
    follow:
      enabled: false
  image: {tag: "0.14.3@sha256:2230fb4802aafe09455b58d38f8f1faedd8f09f042e9a18fffd397e63488c023"}
  # 규칙은 주 버전(:5)이 아니라 정확한 판. container 플러그인은 차트 기본값이 이미 0.7.6으로 고정이다
  config:
    artifact:
      install:
        refs: [falco-rules:5.2.0]
      follow:
        refs: [falco-rules:5.2.0]
