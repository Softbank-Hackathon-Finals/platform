[databases]
chat = host=source-db-rw.source-dev.svc.cluster.local port=5432 dbname=chat

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
unix_socket_dir = /tmp
pidfile = /tmp/pgbouncer.pid
auth_type = scram-sha-256
auth_file = /etc/pgbouncer-auth/userlist.txt
admin_users = cutover_control
pool_mode = transaction
max_client_conn = 100
default_pool_size = 10
max_prepared_statements = 0
server_tls_sslmode = verify-full
server_tls_ca_file = /etc/cnpg-ca/ca.crt
client_tls_sslmode = require
client_tls_cert_file = /etc/cnpg-tls/tls.crt
client_tls_key_file = /etc/cnpg-tls/tls.key
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
ignore_startup_parameters = extra_float_digits,options
