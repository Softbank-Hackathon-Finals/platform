# Image is pinned by digest from publish-sova-mcp-image; a tag is not accepted.
image:
  repository: ghcr.io/softbank-hackathon-finals/platform-sova-mcp
  digest: ""
# Protected operator inputs (created outside this chart; names only).
runtime:
  config: sova-mcp-config                 # Secret with config.json (identities, resource_url, upstreams)
  registrationConfigMap: ""               # current t10-registration ConfigMap (catalog.json, grants.json)
  secrets:
    database: platform-runtime-db
    databaseCA: platform-db-ca
    collectors: ""                        # current t10-registration collector Secret
    registry: platform-ghcr-reader
  # Egress the T10 registration host already has: STS (identity proof) and target APIs.
  trustedEgressCidrs: []
  # Pin the regional STS name to the allowed egress addresses, as the T10 registration host does.
  hostAliases: []
  # Read-only upstream credentials (copies made by the operator in this namespace; names only).
  observability:
    enabled: false
    tokenSecret: sova-mcp-observability-token   # key: token
    caConfigMap: sova-mcp-observability-ca      # key: ca.crt (public CA only, never the server key)
  # T33 findings API (bravo-security:8443). Its ingress requires bravo.security/findings-client=true on this namespace.
  security:
    enabled: false
    tokenSecret: sova-mcp-security-token        # key: token (a read-scope credential of the findings registry)
    caConfigMap: sova-mcp-security-ca           # key: ca.crt
tailnet:
  hostname: sova-mcp
  tags: tag:bravo-platform-operator       # existing grant: autogroup:admin/owner → tcp:443

# Web console (services/console/desktop web build at sova.mangowhois.ai). Off by default. When on, the config Secret's
# optional `access` block ({team_domain, aud, identities: {email: {tenant_id, subject_id}}}) maps each Cloudflare Access
# login to that person's already-pinned SOVA subject; emails stay in the Secret, not here.
webConsole:
  enabled: false
  # Cloudflare's published IPv4 ranges (https://www.cloudflare.com/ips-v4), for the Access signing-key endpoint.
  cloudflareCidrs: [173.245.48.0/20, 103.21.244.0/22, 103.22.200.0/22, 103.31.4.0/22, 141.101.64.0/18, 108.162.192.0/18,
    190.93.240.0/20, 188.114.96.0/20, 197.234.240.0/22, 198.41.128.0/17, 162.158.0.0/15, 104.16.0.0/13, 104.24.0.0/14,
    172.64.0.0/13, 131.0.72.0/22]
