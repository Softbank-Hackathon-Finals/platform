{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" .Values.image.digest) }}{{ fail "image.digest (sha256) is required" }}{{ end }}
{{- if not .Values.runtime.registrationConfigMap }}{{ fail "runtime.registrationConfigMap is required" }}{{ end }}
{{- if not .Values.runtime.secrets.collectors }}{{ fail "runtime.secrets.collectors is required" }}{{ end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sova-mcp
  labels: {app.kubernetes.io/name: sova-mcp, component: platform}
spec:
  replicas: 1   # ponytail: per-process confirmation key; mount a shared key before scaling out.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: sova-mcp}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sova-mcp
        component: platform
        bravo.dev/db-client: runtime
        bravo.dev/target-api-client: collector
    spec:
      serviceAccountName: sova-mcp
      automountServiceAccountToken: false
      imagePullSecrets: [{name: {{ .Values.runtime.secrets.registry }}}]
      {{- with .Values.runtime.hostAliases }}
      hostAliases: {{ toJson . }}
      {{- end }}
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: sova-mcp
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 30}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: config, mountPath: /sova, readOnly: true}
            - {name: registration, mountPath: /registration, readOnly: true}
            - {name: credential, mountPath: /credential, readOnly: true}
            - {name: ca, mountPath: /ca, readOnly: true}
            - {name: collectors, mountPath: /collectors, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            {{- if .Values.runtime.observability.enabled }}
            - {name: observability-token, mountPath: /upstreams/observability/token, readOnly: true}
            - {name: observability-ca, mountPath: /upstreams/observability/ca, readOnly: true}
            {{- end }}
            {{- if .Values.runtime.security.enabled }}
            - {name: security-token, mountPath: /upstreams/security/token, readOnly: true}
            - {name: security-ca, mountPath: /upstreams/security/ca, readOnly: true}
            {{- end }}
      volumes:
        - {name: config, secret: {secretName: {{ .Values.runtime.config }}}}
        - {name: registration, configMap: {name: {{ .Values.runtime.registrationConfigMap }}}}
        - {name: credential, secret: {secretName: {{ .Values.runtime.secrets.database }}}}
        - {name: ca, secret: {secretName: {{ .Values.runtime.secrets.databaseCA }}}}
        - {name: collectors, secret: {secretName: {{ .Values.runtime.secrets.collectors }}}}
        - {name: tmp, emptyDir: {sizeLimit: 16Mi}}
        {{- if .Values.runtime.observability.enabled }}
        - {name: observability-token, secret: {secretName: {{ .Values.runtime.observability.tokenSecret }}}}
        - {name: observability-ca, configMap: {name: {{ .Values.runtime.observability.caConfigMap }}}}
        {{- end }}
        {{- if .Values.runtime.security.enabled }}
        - {name: security-token, secret: {secretName: {{ .Values.runtime.security.tokenSecret }}}}
        - {name: security-ca, configMap: {name: {{ .Values.runtime.security.caConfigMap }}}}
        {{- end }}
