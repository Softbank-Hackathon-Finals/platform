# Declared at creation (default-deny namespace). DB + DNS come from the existing
# runtime-database policy via bravo.dev/db-client=runtime.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sova-mcp
  labels: {app.kubernetes.io/name: sova-mcp, component: platform}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: sova-mcp}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: tailscale-system}}}]
      ports: [{port: 8080, protocol: TCP}]
  egress:
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}, podSelector: {matchLabels: {k8s-app: kube-dns}}}]
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    # Registration probes reach target APIs through the existing collector egress proxy group.
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: tailscale-system}},
            podSelector: {matchLabels: {tailscale.com/parent-resource: bravo-collector-egress, tailscale.com/parent-resource-type: proxygroup}}}]
      ports: [{port: 443, protocol: TCP}, {port: 10000, endPort: 10999, protocol: TCP}, {port: 10469, protocol: TCP}]
    {{- if .Values.runtime.observability.enabled }}
    # Read-only observability API (HTTPS + host token). Its ingress also requires the platform-client namespace label.
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: bravo-observability}},
            podSelector: {matchLabels: {app: bravo-observability-api}}}]
      ports: [{port: 8080, protocol: TCP}]
    {{- end }}
    {{- with .Values.runtime.trustedEgressCidrs }}
    - to: [{{- range $i, $c := . }}{{ if $i }}, {{ end }}{ipBlock: {cidr: {{ $c | quote }}}}{{- end }}]
      ports: [{port: 443, protocol: TCP}]
    {{- end }}
