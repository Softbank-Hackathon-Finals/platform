{{- if not .Values.image.digest }}{{ fail "image.digest is required" }}{{- end }}
{{- if not .Values.configuration.existingConfigMap }}{{ fail "configuration.existingConfigMap is required" }}{{- end }}
{{- if not .Values.reader.existingConfigMap }}{{ fail "reader.existingConfigMap (v2) is required" }}{{- end }}
{{- if not .Values.stateClaim }}{{ fail "stateClaim is required" }}{{- end }}
{{- if not .Values.secrets.executor }}{{ fail "secrets.executor is required" }}{{- end }}
{{- if and .Values.applyCredential.existingConfigMap .Values.secrets.applyKubeconfig }}{{ fail "use applyCredential or secrets.applyKubeconfig, not both" }}{{- end }}
{{- with .Values.gateSigner.roleArn }}{{- if not (regexMatch "^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_-]+$" .) }}{{ fail "gateSigner.roleArn must be one IAM role ARN" }}{{- end }}{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: t10-workflow-host
  labels:
    app.kubernetes.io/name: t10-workflow-host
    component: platform
spec:
  # One driver per plan store: the receipts/dispatch state and the ApplicationHost lock are single-writer.
  replicas: 1
  revisionHistoryLimit: 10
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: t10-workflow-host
      component: platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: t10-workflow-host
        component: platform
        bravo.dev/db-client: runtime
        # T31 apply: a declared client of bravo-apply-egress (infra/iac/environments/platform.json).
        bravo.dev/target-api-client: apply
      annotations:
        bravo.dev/reviewed-source: {{ .Values.sourceRevision | quote }}
        bravo.dev/config-sha256: {{ .Values.configuration.sha256 | quote }}
    spec:
      serviceAccountName: t10-workflow-host
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
        - name: {{ .Values.secrets.registry }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: host
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: Always
          command: [python, -m, bravo_platform_events.workflow_host_server]
          args: [--ports, "bravo_platform_events.workflow_ports:create_ports", --interval, {{ .Values.interval | quote }}]
          env:
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - {name: PYTHONUNBUFFERED, value: "1"}
            - {name: HOME, value: /tmp}
            {{- if .Values.gateSigner.roleArn }}
            # T19 platform signer (ADR-0038): boto3's web identity provider, nothing stored.
            - {name: AWS_ROLE_ARN, value: {{ .Values.gateSigner.roleArn | quote }}}
            - {name: AWS_WEB_IDENTITY_TOKEN_FILE, value: /var/run/secrets/sts/token}
            - {name: AWS_REGION, value: {{ .Values.gateSigner.region | quote }}}
            - {name: AWS_STS_REGIONAL_ENDPOINTS, value: regional}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: credential, mountPath: /credential, readOnly: true}
            - {name: database-ca, mountPath: /ca, readOnly: true}
            - {name: config, mountPath: /workflow, readOnly: true}
            - {name: reader-config, mountPath: /product-read, readOnly: true}
            - {name: catalog, mountPath: /catalog, readOnly: true}
            - {name: catalog-key, mountPath: /catalog-key, readOnly: true}
            - {name: executor, mountPath: /executor, readOnly: true}
            {{- if .Values.secrets.githubApp }}
            - {name: github-app, mountPath: /github-app, readOnly: true}
            {{- end }}
            {{- if or .Values.secrets.applyKubeconfig .Values.applyCredential.existingConfigMap }}
            - {name: apply-kubeconfig, mountPath: /t31, readOnly: true}
            {{- end }}
            - {name: state, mountPath: /workflow-state}
            {{- if .Values.initialProposalAuto.enabled }}
            # Only for creating and reading initial-proposal Jobs in bravo-initial (Role there allows nothing else).
            - {name: kube-api-token, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true}
            {{- end }}
            {{- if .Values.gateSigner.roleArn }}
            - {name: sts-token, mountPath: /var/run/secrets/sts, readOnly: true}
            {{- end }}
            - {name: tmp, mountPath: /tmp}
      volumes:
        {{- if .Values.gateSigner.roleArn }}
        # Audience sts.amazonaws.com only: this token cannot call the Kubernetes API.
        - name: sts-token
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken: {path: token, audience: sts.amazonaws.com, expirationSeconds: 3600}
        {{- end }}
        {{- if .Values.initialProposalAuto.enabled }}
        - name: kube-api-token
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken: {path: token, expirationSeconds: 3600}
              - configMap: {name: kube-root-ca.crt, items: [{key: ca.crt, path: ca.crt}]}
        {{- end }}
        - name: credential
          secret:
            secretName: {{ .Values.secrets.database }}
            defaultMode: 0440
            items:
              - {key: username, path: username}
              - {key: password, path: password}
        - name: database-ca
          secret:
            secretName: {{ .Values.secrets.databaseCA }}
            defaultMode: 0440
            items:
              - {key: ca.crt, path: ca.crt}
        - name: config
          configMap:
            name: {{ .Values.configuration.existingConfigMap }}
            defaultMode: 0444
        - name: reader-config
          configMap:
            name: {{ .Values.reader.existingConfigMap }}
            defaultMode: 0444
        - name: catalog
          persistentVolumeClaim:
            claimName: {{ .Values.reader.catalogClaim }}
            readOnly: true
        - name: catalog-key
          secret:
            secretName: {{ .Values.secrets.catalogKey }}
            defaultMode: 0440
            items:
              - {key: key, path: key}
        - name: executor
          secret:
            secretName: {{ .Values.secrets.executor }}
            defaultMode: 0440
            items:
              - {key: ca.crt, path: ca.crt}
              - {key: read-token, path: read-token}
        {{- if .Values.secrets.githubApp }}
        - name: github-app
          secret:
            secretName: {{ .Values.secrets.githubApp }}
            defaultMode: 0440
            items:
              - {key: private-key.pem, path: private-key.pem}
        {{- end }}
        {{- if .Values.secrets.applyKubeconfig }}
        - name: apply-kubeconfig
          secret:
            secretName: {{ .Values.secrets.applyKubeconfig }}
            defaultMode: 0440
            items:
              - {key: kubeconfig, path: kubeconfig}
        {{- else if .Values.applyCredential.existingConfigMap }}
        # Same mount path: application.json keeps /t31/kubeconfig; the exec plugin mints a 600 s token per use.
        - name: apply-kubeconfig
          configMap:
            name: {{ .Values.applyCredential.existingConfigMap }}
            defaultMode: 0444
            items:
              - {key: kubeconfig, path: kubeconfig}
              - {key: registration.json, path: registration.json}
        {{- end }}
        - name: state
          persistentVolumeClaim:
            claimName: {{ .Values.stateClaim }}
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
