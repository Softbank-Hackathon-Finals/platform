# Image: the registration image (Product Reader packages + pinned git, needed by the candidate writer).
image:
  repository: ghcr.io/softbank-hackathon-finals/platform-registration
  digest: ""
sourceRevision: ""
# Protected host inputs (ConfigMap): ports.json (workflow_ports), sli-profile.json (optional).
configuration:
  existingConfigMap: ""
  sha256: ""
# The Product Reader's v2 configuration (reader.json + cluster-jwks.json), catalog and key, read-only.
reader:
  existingConfigMap: ""
  catalogClaim: ""
# Writer dispatch times and the demo-chat object clone; must survive restarts.
stateClaim: ""
secrets:
  database: platform-runtime-db
  databaseCA: platform-db-ca
  catalogKey: ""
  # ca.crt and read-token for the Cutover Executor read API (no command token).
  executor: ""
  # private-key.pem of the bravo-platform-host GitHub App (optional: empty = operator pins only).
  githubApp: ""
  # kubeconfig of the target apply-deployer (T31 REHEARSE; short-lived token; optional: empty = no apply).
  applyKubeconfig: ""
  registry: platform-ghcr-reader
# T31 apply identity without a stored token: an existing ConfigMap with `kubeconfig` (exec plugin
# /usr/local/bin/bravo-credential) and `registration.json` (registration + anchor_uid, no secret).
# Use this or secrets.applyKubeconfig, not both.
applyCredential:
  existingConfigMap: ""
# T49 (11/8 user decision): mount secrets.registry so REHEARSE refreshes the target's pull Secret
# (application.json "pull_secret": {"name", "source": "/ghcr/.dockerconfigjson"}).
candidatePull:
  enabled: false
interval: 15
resources:
  requests: {cpu: 50m, memory: 192Mi}
  limits: {cpu: 500m, memory: 512Mi}
# T49: the host admits the plan's one registered task and creates the initial-proposal Job itself
# (workflow_ports `propose.auto`). Needs the bravo-initial Role from infra/gitops (initialProposal.hostCreatesJobs)
# and an API token: projected, 1 hour, mounted only when this is on.
initialProposalAuto:
  enabled: false
