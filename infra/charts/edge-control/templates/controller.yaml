apiVersion: v1
kind: ServiceAccount
metadata:
  name: t17-edge-control
  labels: {component: platform}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: t17-edge-control
  labels: {app.kubernetes.io/name: t17-edge-control, component: platform}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: t17-edge-control, component: platform}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: t17-edge-control
        component: platform
        bravo.dev/db-client: runtime
      annotations:
        bravo.dev/source-revision: {{ .Values.sourceRevision | quote }}
        bravo.dev/config-sha256: {{ .Values.configuration.sha256 | quote }}
    spec:
      serviceAccountName: t17-edge-control
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
        - name: {{ .Values.secrets.registry }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: controller
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: Always
          command: [python, -m, bravo_edge_control.daemon]
          args: [--config, /runtime/edge.json, --ports, {{ .Values.ports | quote }}, serve]
          env:
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - {name: PYTHONUNBUFFERED, value: "1"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            exec:
              command: [python, -m, bravo_edge_control.daemon, --live, health]
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            exec:
              command: [python, -m, bravo_edge_control.daemon, --live, health]
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command: [python, -m, bravo_edge_control.daemon, health]
            periodSeconds: 5
          volumeMounts:
            - {name: credential, mountPath: /credential, readOnly: true}
            - {name: ca, mountPath: /ca, readOnly: true}
            - {name: provider, mountPath: /provider, readOnly: true}
            - {name: authority, mountPath: /authority, readOnly: true}
            - {name: runtime, mountPath: /runtime, readOnly: true}
            - {name: journal, mountPath: /journal}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: credential
          secret:
            secretName: {{ .Values.secrets.database }}
            defaultMode: 0440
            items:
              - {key: username, path: username}
              - {key: password, path: password}
        - name: ca
          secret:
            secretName: {{ .Values.secrets.databaseCA }}
            defaultMode: 0440
            items:
              - {key: ca.crt, path: ca.crt}
        - name: provider
          secret:
            secretName: {{ .Values.secrets.provider }}
            defaultMode: 0440
            items:
              - {key: token, path: token}
        - name: authority
          secret:
            secretName: {{ .Values.secrets.authority }}
            defaultMode: 0440
        - name: runtime
          configMap:
            name: {{ .Values.configuration.existingConfigMap }}
            defaultMode: 0444
        - name: journal
          persistentVolumeClaim:
            claimName: {{ .Values.journalClaim }}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 16Mi}
