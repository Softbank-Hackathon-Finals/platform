{{- if .Values.openai.enabled }}
{{- if not .Values.openai.openbaoCaBundle }}{{ fail "openai.openbaoCaBundle (platform OpenBao CA, public PEM base64) is required" }}{{ end }}
# Same shape as the platform's other stores: OpenBao jwt-operator role per service account, 10-minute token.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.openai.secretStore }}
  labels: {app.kubernetes.io/name: sova-console-web, component: platform}
spec:
  provider:
    vault:
      server: https://platform-openbao.platform-secrets.svc:8200
      path: platform
      version: v2
      caBundle: {{ .Values.openai.openbaoCaBundle }}
      auth:
        jwt:
          path: jwt-operator
          role: {{ .Values.openai.secretStore }}
          kubernetesServiceAccountToken:
            serviceAccountRef: {name: sova-console-web}
            audiences: [bravo-platform-secrets]
            expirationSeconds: 600
---
# OpenBao platform/{{ .Values.openai.openbaoKey }} (field api_key) → file /var/run/secrets/sova-console/openai/api_key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sova-console-web-openai
  labels: {app.kubernetes.io/name: sova-console-web, component: platform}
spec:
  refreshInterval: 15m
  secretStoreRef: {kind: SecretStore, name: {{ .Values.openai.secretStore }}}
  target: {name: sova-console-web-openai, creationPolicy: Owner}
  data:
    - secretKey: api_key
      remoteRef: {key: {{ .Values.openai.openbaoKey }}, property: api_key}
{{- end }}
