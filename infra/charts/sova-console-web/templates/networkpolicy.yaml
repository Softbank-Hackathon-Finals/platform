# platform-state is default-deny. In: only the public entry (Cloudflare Tunnel, Access checked at the origin).
# Out: DNS, the SOVA MCP, and Cloudflare (Access signing keys, OpenAI API, public platform Argo API).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sova-console-web
  labels: {app.kubernetes.io/name: sova-console-web, component: platform}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: sova-console-web}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: public-entry}}}]
      ports: [{port: 8080, protocol: TCP}]
  egress:
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}, podSelector: {matchLabels: {k8s-app: kube-dns}}}]
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: sova-mcp}}}]
      ports: [{port: 8080, protocol: TCP}]
    - to: [{{- range $i, $c := .Values.cloudflareCidrs }}{{ if $i }}, {{ end }}{ipBlock: {cidr: {{ $c | quote }}}}{{- end }}]
      ports: [{port: 443, protocol: TCP}]
