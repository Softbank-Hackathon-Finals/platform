# Published by publish-sova-console-web-image (develop commits only). The digest is required.
image:
  repository: ghcr.io/softbank-hackathon-finals/platform-sova-console-web
  digest: ""
imagePullSecret: platform-ghcr-reader

publicOrigin: https://sova.mangowhois.ai
# The in-cluster SOVA MCP. Its config must list this host in allowed_hosts and map Access emails (see sova-mcp chart webConsole).
mcpUrl: http://sova-mcp.platform-state.svc:443/mcp
argoPlatformUrl: https://platform-argocd.mangowhois.ai

# Cloudflare Access: the team domain and the audience tag of the Access application the public-entry reconciler made.
# Until aud is set the server refuses /api and logs the first token's iss/aud (no email) to read it from.
access:
  teamDomain: ""
  aud: ""

# Model key for the guide, from platform OpenBao (never Git, never the person's). Off until the store exists;
# without it the console runs and the guide says the platform key is missing. One-time setup: see the chart README.
openai:
  enabled: false
  secretStore: sova-console-web
  openbaoKey: sova/console-web
  openbaoCaBundle: ""   # the platform OpenBao CA (public), as in the other platform SecretStores

resources:
  requests: {cpu: 50m, memory: 256Mi}
  limits: {memory: 1Gi}

# Cloudflare's published IPv4 ranges (https://www.cloudflare.com/ips-v4): Access signing keys, the OpenAI API and the
# public platform Argo API all sit behind them.
cloudflareCidrs: [173.245.48.0/20, 103.21.244.0/22, 103.22.200.0/22, 103.31.4.0/22, 141.101.64.0/18, 108.162.192.0/18,
  190.93.240.0/20, 188.114.96.0/20, 197.234.240.0/22, 198.41.128.0/17, 162.158.0.0/15, 104.16.0.0/13, 104.24.0.0/14,
  172.64.0.0/13, 131.0.72.0/22]
