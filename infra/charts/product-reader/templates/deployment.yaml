apiVersion: apps/v1
kind: Deployment
metadata:
  name: t10-product-reader
  labels:
    app.kubernetes.io/name: t10-product-reader
    component: platform
spec:
  replicas: 1
  revisionHistoryLimit: 10
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: t10-product-reader
      component: platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: t10-product-reader
        component: platform
        bravo.dev/db-client: runtime
      annotations:
        bravo.dev/reviewed-source: {{ .Values.sourceRevision | quote }}
        bravo.dev/config-sha256: {{ .Values.configuration.sha256 | quote }}
    spec:
      serviceAccountName: platform-runtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 25
      imagePullSecrets:
        - name: {{ .Values.secrets.registry }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reader
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: Always
          command: [python, -m, bravo_platform_events.product_read_server]
          args: [--config, /product-read/reader.json, --tls-cert, /tls/tls.crt, --tls-key, /tls/tls.key, --initial-proposal]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          ports:
            - name: https
              containerPort: 8443
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            tcpSocket:
              port: https
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            tcpSocket:
              port: https
            periodSeconds: 10
          volumeMounts:
            - {name: credential, mountPath: /credential, readOnly: true}
            - {name: database-ca, mountPath: /ca, readOnly: true}
            - {name: config, mountPath: /product-read, readOnly: true}
            - {name: catalog, mountPath: /catalog, readOnly: true}
            - {name: catalog-key, mountPath: /catalog-key, readOnly: true}
            - {name: tls, mountPath: /tls, readOnly: true}
      volumes:
        - name: credential
          secret:
            secretName: {{ .Values.secrets.database }}
            defaultMode: 0440
            items:
              - {key: username, path: username}
              - {key: password, path: password}
        - name: database-ca
          secret:
            secretName: {{ .Values.secrets.databaseCA }}
            defaultMode: 0440
            items:
              - {key: ca.crt, path: ca.crt}
        - name: config
          configMap:
            name: {{ .Values.configuration.existingConfigMap }}
            defaultMode: 0444
        - name: catalog
          persistentVolumeClaim:
            claimName: {{ .Values.catalogClaim }}
            readOnly: true
        - name: catalog-key
          secret:
            secretName: {{ .Values.secrets.catalogKey }}
            defaultMode: 0440
            items:
              - {key: key, path: key}
        - name: tls
          secret:
            secretName: {{ .Values.secrets.tls }}
            defaultMode: 0440
            items:
              - {key: tls.crt, path: tls.crt}
              - {key: tls.key, path: tls.key}
