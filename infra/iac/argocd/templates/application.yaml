{{- /* Argo CD CRDs come with this release: the first install creates them, the next upgrade adds this. */}}
{{- if and .Values.application.enabled (.Capabilities.APIVersions.Has "argoproj.io/v1alpha1/Application") }}
{{- $environment := required "environment is required" .Values.environment }}
{{- $tailnet := required "tailnet (<name>.ts.net) is required" .Values.tailnet }}
{{- $revision := required "targetRevision (the reviewed full commit SHA) is required" .Values.targetRevision }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bravo-iac-{{ $environment }}
  namespace: {{ .Release.Namespace }}
spec:
  project: bravo-iac
  source:
    repoURL: {{ .Values.repoURL | quote }}
    targetRevision: {{ $revision | quote }}
    path: infra/iac/charts/{{ $environment }}
    helm:
      releaseName: bravo-iac-{{ $environment }}
      valuesObject:
        tailnet: {{ $tailnet | quote }}
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      enabled: {{ .Values.application.autoSync }}
      prune: {{ .Values.application.prune }}
      selfHeal: true
      allowEmpty: false
    # No CreateNamespace: namespaces belong to whoever builds the cluster (T45), never to this chart.
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    # Enabled only after the cluster's builder made the namespaces and Tailscale CRDs (README), so a
    # failure is real: retry a few times (about 5 minutes), then stop so a fixed revision can sync.
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
{{- end }}
