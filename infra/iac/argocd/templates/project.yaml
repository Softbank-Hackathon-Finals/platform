{{- /* Argo CD CRDs come with this release: the first install creates them, the next upgrade adds this. */}}
{{- if and .Values.application.enabled (.Capabilities.APIVersions.Has "argoproj.io/v1alpha1/Application") }}
{{- /*
Phase 1 (ADR-0032): generous on purpose, so the happy path is simple. One repository, this cluster
only, any namespace and kind. Narrow it once the path is stable: see infra/iac/README.md.
*/}}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: bravo-iac
  namespace: {{ .Release.Namespace }}
spec:
  description: Generated destination IaC of this cluster ({{ .Values.environment }})
  sourceRepos:
    - {{ .Values.repoURL | quote }}
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
{{- end }}
