{{- $_ := required "tailnet (the <name>.ts.net suffix) is required" .Values.tailnet }}
---
{
  "apiVersion": "tailscale.com/v1alpha1",
  "kind": "ProxyGroup",
  "metadata": {
    "labels": {
      "app.kubernetes.io/managed-by": "bravo-iac",
      "bravo.dev/iac-module": "tailnet-egress"
    },
    "name": "bravo-target-collector"
  },
  "spec": {
    "replicas": 1,
    "tags": [
      "tag:bravo-target-collector"
    ],
    "type": "egress"
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "annotations": {
      "tailscale.com/proxy-group": "bravo-target-collector",
      "tailscale.com/tailnet-fqdn": "bravo-metrics.{{ .Values.tailnet }}"
    },
    "labels": {
      "app.kubernetes.io/managed-by": "bravo-iac",
      "bravo.dev/iac-module": "tailnet-egress"
    },
    "name": "bravo-metrics",
    "namespace": "bravo-observability"
  },
  "spec": {
    "externalName": "placeholder",
    "ports": [
      {
        "name": "otlp",
        "port": 9090,
        "protocol": "TCP"
      }
    ],
    "type": "ExternalName"
  }
}
---
{
  "apiVersion": "networking.k8s.io/v1",
  "kind": "NetworkPolicy",
  "metadata": {
    "labels": {
      "app.kubernetes.io/managed-by": "bravo-iac",
      "bravo.dev/iac-module": "tailnet-egress"
    },
    "name": "bravo-target-collector-client",
    "namespace": "bravo-observability"
  },
  "spec": {
    "egress": [
      {
        "ports": [
          {
            "port": 53,
            "protocol": "UDP"
          },
          {
            "port": 53,
            "protocol": "TCP"
          }
        ],
        "to": [
          {
            "namespaceSelector": {
              "matchLabels": {
                "kubernetes.io/metadata.name": "kube-system"
              }
            }
          }
        ]
      },
      {
        "ports": [
          {
            "endPort": 10999,
            "port": 10000,
            "protocol": "TCP"
          }
        ],
        "to": [
          {
            "namespaceSelector": {
              "matchLabels": {
                "kubernetes.io/metadata.name": "tailscale-system"
              }
            },
            "podSelector": {
              "matchLabels": {
                "tailscale.com/parent-resource": "bravo-target-collector",
                "tailscale.com/parent-resource-type": "proxygroup"
              }
            }
          }
        ]
      }
    ],
    "podSelector": {
      "matchLabels": {
        "app": "bravo-collector"
      }
    },
    "policyTypes": [
      "Egress"
    ]
  }
}
---
{
  "apiVersion": "networking.k8s.io/v1",
  "kind": "NetworkPolicy",
  "metadata": {
    "labels": {
      "app.kubernetes.io/managed-by": "bravo-iac",
      "bravo.dev/iac-module": "tailnet-egress"
    },
    "name": "bravo-target-collector-ingress",
    "namespace": "tailscale-system"
  },
  "spec": {
    "ingress": [
      {
        "from": [
          {
            "podSelector": {
              "matchLabels": {
                "app": "operator"
              }
            }
          }
        ],
        "ports": [
          {
            "port": 9002,
            "protocol": "TCP"
          }
        ]
      },
      {
        "from": [
          {
            "namespaceSelector": {
              "matchLabels": {
                "kubernetes.io/metadata.name": "bravo-observability"
              }
            },
            "podSelector": {
              "matchLabels": {
                "app": "bravo-collector"
              }
            }
          }
        ],
        "ports": [
          {
            "endPort": 10999,
            "port": 10000,
            "protocol": "TCP"
          }
        ]
      }
    ],
    "podSelector": {
      "matchLabels": {
        "tailscale.com/parent-resource": "bravo-target-collector",
        "tailscale.com/parent-resource-type": "proxygroup"
      }
    },
    "policyTypes": [
      "Ingress"
    ]
  }
}
