{{- $_ := required "tailnet (the <name>.ts.net suffix) is required" .Values.tailnet }}
---
{
  "apiVersion": "v1",
  "kind": "Namespace",
  "metadata": {
    "annotations": {
      "argocd.argoproj.io/sync-options": "Prune=false,Delete=false",
      "argocd.argoproj.io/sync-wave": "-1"
    },
    "labels": {
      "app.kubernetes.io/managed-by": "bravo-iac"
    },
    "name": "bravo-observability"
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Namespace",
  "metadata": {
    "annotations": {
      "argocd.argoproj.io/sync-options": "Prune=false,Delete=false",
      "argocd.argoproj.io/sync-wave": "-1"
    },
    "labels": {
      "app.kubernetes.io/managed-by": "bravo-iac"
    },
    "name": "tailscale-system"
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Namespace",
  "metadata": {
    "annotations": {
      "argocd.argoproj.io/sync-options": "Prune=false,Delete=false",
      "argocd.argoproj.io/sync-wave": "-1"
    },
    "labels": {
      "app.kubernetes.io/managed-by": "bravo-iac"
    },
    "name": "target-dev"
  }
}
---
{
  "apiVersion": "tailscale.com/v1alpha1",
  "kind": "ProxyGroup",
  "metadata": {
    "labels": {
      "app.kubernetes.io/managed-by": "bravo-iac",
      "bravo.dev/iac-module": "tailnet-egress"
    },
    "name": "bravo-target-collector"
  },
  "spec": {
    "replicas": 1,
    "tags": [
      "tag:bravo-target-collector"
    ],
    "type": "egress"
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "annotations": {
      "tailscale.com/proxy-group": "bravo-target-collector",
      "tailscale.com/tailnet-fqdn": "bravo-metrics.{{ .Values.tailnet }}"
    },
    "labels": {
      "app.kubernetes.io/managed-by": "bravo-iac",
      "bravo.dev/iac-module": "tailnet-egress"
    },
    "name": "bravo-metrics",
    "namespace": "bravo-observability"
  },
  "spec": {
    "externalName": "placeholder",
    "ports": [
      {
        "name": "otlp",
        "port": 9090,
        "protocol": "TCP"
      }
    ],
    "type": "ExternalName"
  }
}
---
{
  "apiVersion": "networking.k8s.io/v1",
  "kind": "NetworkPolicy",
  "metadata": {
    "labels": {
      "app.kubernetes.io/managed-by": "bravo-iac",
      "bravo.dev/iac-module": "tailnet-egress"
    },
    "name": "bravo-target-collector-client",
    "namespace": "bravo-observability"
  },
  "spec": {
    "egress": [
      {
        "ports": [
          {
            "port": 53,
            "protocol": "UDP"
          },
          {
            "port": 53,
            "protocol": "TCP"
          }
        ],
        "to": [
          {
            "namespaceSelector": {
              "matchLabels": {
                "kubernetes.io/metadata.name": "kube-system"
              }
            }
          }
        ]
      },
      {
        "ports": [
          {
            "endPort": 10999,
            "port": 10000,
            "protocol": "TCP"
          }
        ],
        "to": [
          {
            "namespaceSelector": {
              "matchLabels": {
                "kubernetes.io/metadata.name": "tailscale-system"
              }
            },
            "podSelector": {
              "matchLabels": {
                "tailscale.com/parent-resource": "bravo-target-collector",
                "tailscale.com/parent-resource-type": "proxygroup"
              }
            }
          }
        ]
      }
    ],
    "podSelector": {
      "matchLabels": {
        "app": "bravo-collector"
      }
    },
    "policyTypes": [
      "Egress"
    ]
  }
}
---
{
  "apiVersion": "networking.k8s.io/v1",
