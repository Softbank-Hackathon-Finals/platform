---
{
  "apiVersion": "tailscale.com/v1alpha1",
  "kind": "ProxyGroup",
  "metadata": {
    "labels": {
      "app.kubernetes.io/managed-by": "bravo-iac",
      "bravo.dev/iac-module": "tailnet-egress"
    },
    "name": "bravo-cutover-control-gce"
  },
  "spec": {
    "replicas": 1,
    "tags": [
      "tag:bravo-cutover-control-gce"
    ],
    "type": "egress"
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "annotations": {
      "tailscale.com/proxy-group": "bravo-cutover-control-gce",
      "tailscale.com/tailnet-fqdn": "bravo-source-gce-db.{{ .Values.tailnet }}"
    },
    "labels": {
      "app.kubernetes.io/managed-by": "bravo-iac",
      "bravo.dev/iac-module": "tailnet-egress"
    },
    "name": "source-gce-db-for-cutover",
    "namespace": "bravo-platform"
  },
  "spec": {
    "externalName": "placeholder",
    "ports": [
      {
        "name": "db",
        "port": 5432,
        "protocol": "TCP"
      }
    ],
    "type": "ExternalName"
  }
}
