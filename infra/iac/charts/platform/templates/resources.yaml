  "apiVersion": "networking.k8s.io/v1",
  "kind": "NetworkPolicy",
  "metadata": {
    "labels": {
      "app.kubernetes.io/managed-by": "bravo-iac",
      "bravo.dev/iac-module": "tailnet-egress"
    },
    "name": "bravo-cutover-control-client",
    "namespace": "bravo-platform"
  },
  "spec": {
    "egress": [
      {
        "ports": [
          {
            "port": 53,
            "protocol": "UDP"
          },
          {
            "port": 53,
            "protocol": "TCP"
          }
        ],
        "to": [
          {
            "namespaceSelector": {
              "matchLabels": {
                "kubernetes.io/metadata.name": "kube-system"
              }
            }
          }
        ]
      },
      {
        "ports": [
          {
            "endPort": 10999,
            "port": 10000,
            "protocol": "TCP"
          }
        ],
        "to": [
          {
            "namespaceSelector": {
              "matchLabels": {
                "kubernetes.io/metadata.name": "tailscale-system"
              }
            },
            "podSelector": {
              "matchLabels": {
                "tailscale.com/parent-resource": "bravo-cutover-control",
                "tailscale.com/parent-resource-type": "proxygroup"
              }
            }
          }
        ]
      }
    ],
    "podSelector": {
      "matchLabels": {
        "app.kubernetes.io/name": "cutover-executor"
      }
    },
    "policyTypes": [
      "Egress"
    ]
  }
}
