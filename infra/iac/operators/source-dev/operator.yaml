apiVersion: apps/v1
kind: Deployment
metadata:
  name: operator
  namespace: tailscale-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: operator
  template:
    metadata:
      labels:
        app: operator
    spec:
      serviceAccountName: operator
      volumes:
        - name: oauth
          secret:
            secretName: operator-oauth
      containers:
        - name: operator
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          image: tailscale/k8s-operator@sha256:48d373932bae9b65f5ded6480276b2290f16b8d43794ec9dcc3faf50137802eb
          imagePullPolicy: IfNotPresent
          env:
            - name: OPERATOR_INITIAL_TAGS
              value: tag:bravo-source-operator
            - name: OPERATOR_HOSTNAME
              value: bravo-source-operator
            - name: OPERATOR_SECRET
              value: operator
            - name: OPERATOR_LOGGING
              value: info
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OPERATOR_SERVICE_ACCOUNT_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
            - name: OPERATOR_LOGIN_SERVER
              value: 
            - name: OPERATOR_INGRESS_CLASS_NAME
              value: bravo-t8-unused
            - name: CLIENT_ID_FILE
              value: /oauth/client_id
            - name: CLIENT_SECRET_FILE
              value: /oauth/client_secret
            - name: PROXY_IMAGE
              value: tailscale/tailscale@sha256:519bf6f2c386992052216ea7e9391d5ace3a859d458f4f61bc8db8c58377eb7d
            - name: PROXY_TAGS
              value: tag:bravo-source-db
            - name: APISERVER_PROXY
              value: "noauth"
            - name: PROXY_FIREWALL_MODE
              value: auto
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: OPERATOR_SHARED_ACME_ACCOUNT_KEY
              value: "false"
          volumeMounts:
            - name: oauth
              mountPath: /oauth
              readOnly: true
      nodeSelector:
        kubernetes.io/os: linux
