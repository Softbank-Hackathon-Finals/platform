{{- /*
T44: the platform cluster's tailnet routes, generated by bravo-iac (infra/iac/charts/platform) from
infra/iac/environments/platform.json. Off by default. A merge alone never applies: the reviewed full
commit SHA is a required value (develop needs no approval). The tailnet suffixes are values here and
never in Git. The project allows exactly the namespaces and kinds that chart contains
(test_iac_network_application.py keeps them equal).

Turning it on also needs the controller's permissions, which this file does not grant: Role and
RoleBinding in each namespace below plus cluster access to tailscale.com ProxyGroup (the chart declares no
Namespace since #632; the namespaces belong to the existing platform setup),
`clusterCredentials.platform.namespaces`/`clusterResources`, and `resource.inclusions` for these kinds.
*/}}
{{- if .Values.iacNetwork.enabled }}
{{- $n := .Values.iacNetwork }}
{{- $suffix := "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\\.ts\\.net$" }}
{{- if not (regexMatch "^[0-9a-f]{40}$" ($n.targetRevision | default "")) }}
{{- fail "iacNetwork.targetRevision must be the reviewed full commit SHA" }}
{{- end }}
{{- if not (regexMatch $suffix ($n.tailnet | default "")) }}
{{- fail "iacNetwork.tailnet must be the <name>.ts.net suffix" }}
{{- end }}
{{- range $key, $value := ($n.tailnets | default dict) }}
{{- if not (regexMatch $suffix ($value | default "")) }}
{{- fail (printf "iacNetwork.tailnets.%s must be the <name>.ts.net suffix" $key) }}
{{- end }}
{{- end }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-iac-network
  namespace: {{ .Release.Namespace }}
spec:
  project: platform-iac-network
  source:
    repoURL: https://github.com/Softbank-Hackathon-Finals/platform.git
    targetRevision: {{ $n.targetRevision | quote }}
    path: infra/iac/charts/platform
    helm:
      releaseName: iac-network
      valuesObject:
        tailnet: {{ $n.tailnet | quote }}
        tailnets:
          {{- toYaml ($n.tailnets | default dict) | nindent 10 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: bravo-platform
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - ServerSideApply=true
      - FailOnSharedResource=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-iac-network
spec:
  description: T44 platform tailnet routes (ProxyGroups, egress Services, NetworkPolicies) generated by bravo-iac
  sourceRepos:
    - https://github.com/Softbank-Hackathon-Finals/platform.git
  destinations:
    {{- range list "bravo-apply-control" "bravo-platform" "bravo-rehearsal-control" "platform-state" "tailscale-system" }}
    - server: https://kubernetes.default.svc
      namespace: {{ . }}
    {{- end }}
  clusterResourceWhitelist:
    - {group: tailscale.com, kind: ProxyGroup}
  namespaceResourceWhitelist:
    - {group: "", kind: Service}
    - {group: networking.k8s.io, kind: NetworkPolicy}
{{- end }}
