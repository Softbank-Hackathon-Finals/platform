{{- if .Values.productReader.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-product-reader
spec:
  description: Product Reader Deployment and Service only
  sourceRepos:
    - https://github.com/Softbank-Hackathon-Finals/platform.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: platform-state
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - {group: apps, kind: Deployment}
    - {group: "", kind: Service}
{{- end }}
