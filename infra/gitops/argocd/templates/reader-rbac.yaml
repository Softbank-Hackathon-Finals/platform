{{- if .Values.productReader.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-gitops-product-reader
  namespace: platform-state
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [t10-product-reader]
    verbs: [update, patch, delete]
  - apiGroups: [""]
    resources: [services]
    resourceNames: [t10-product-reader]
    verbs: [update, patch, delete]
  # Existing controller read/create grants are bounded by the common name policy.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-gitops-product-reader
  namespace: platform-state
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-gitops-product-reader
subjects:
  - kind: ServiceAccount
    name: bravo-gitops-application-controller
    namespace: {{ .Release.Namespace }}
{{- end }}
