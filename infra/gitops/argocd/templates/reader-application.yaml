{{- if .Values.productReader.enabled }}
{{- range $key, $_ := .Values.productReader.runtime }}
{{- if not (has $key (list "configuration" "secrets" "catalogClaim")) }}
{{- fail "runtime input may contain only configuration, secrets and catalogClaim" }}
{{- end }}
{{- end }}
{{- if not .Values.productReader.runtime.configuration }}
{{- fail "protected Reader configuration is required" }}
{{- end }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-product-reader
  namespace: {{ .Release.Namespace }}
spec:
  project: platform-product-reader
  source:
    repoURL: https://github.com/Softbank-Hackathon-Finals/platform.git
    targetRevision: develop
    path: infra/charts/product-reader
    helm:
      releaseName: product-reader
      valueFiles:
        - ../../gitops/environments/development/product-reader-image.json
      valuesObject:
        {{- toYaml .Values.productReader.runtime | nindent 8 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-state
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - FailOnSharedResource=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
{{- end }}
