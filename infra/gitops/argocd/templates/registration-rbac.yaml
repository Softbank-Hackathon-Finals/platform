apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-gitops-registration
  namespace: platform-state
rules:
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods, services, serviceaccounts]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [t10-registration]
    verbs: [update, patch, delete]
  - apiGroups: [""]
    resources: [services, serviceaccounts]
    resourceNames: [t10-registration]
    verbs: [update, patch, delete]
  # RBAC cannot restrict CREATE by resourceNames; the admission policy below does.
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [create]
  - apiGroups: [""]
    resources: [services, serviceaccounts]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-gitops-registration
  namespace: platform-state
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-gitops-registration
subjects:
  - kind: ServiceAccount
    name: bravo-gitops-application-controller
    namespace: {{ .Release.Namespace }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: platform-gitops-registration-names
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [apps, ""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [deployments, services, serviceaccounts]
  matchConditions:
    - name: registration-controller
      expression: "request.userInfo.username == 'system:serviceaccount:{{ .Release.Namespace }}:bravo-gitops-application-controller'"
  validations:
    - expression: "request.namespace == 'platform-state' && (object != null ? object.metadata.name : oldObject.metadata.name) == 't10-registration'"
      message: This controller may write only the registration workload.
    - expression: "object == null || request.resource.resource != 'services' || object.spec.type == 'ClusterIP'"
      message: Registration must remain a private ClusterIP Service.
    - expression: "object == null || request.resource.resource != 'serviceaccounts' || (has(object.automountServiceAccountToken) && object.automountServiceAccountToken == false)"
      message: Registration must not automatically mount Kubernetes credentials.
    - expression: >-
        object == null || request.resource.resource != 'deployments' ||
        (object.spec.template.spec.serviceAccountName == 't10-registration' &&
        has(object.spec.template.spec.automountServiceAccountToken) && object.spec.template.spec.automountServiceAccountToken == false &&
        (!has(object.spec.template.spec.hostNetwork) || object.spec.template.spec.hostNetwork == false) &&
        (!has(object.spec.template.spec.hostPID) || object.spec.template.spec.hostPID == false) &&
        (!has(object.spec.template.spec.hostIPC) || object.spec.template.spec.hostIPC == false) &&
        object.spec.template.spec.volumes.all(v, !has(v.hostPath) && !has(v.projected)))
      message: Registration cannot acquire host or Kubernetes API credentials.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: platform-gitops-registration-names
spec:
  policyName: platform-gitops-registration-names
  validationActions: [Deny]
