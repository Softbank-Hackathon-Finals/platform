{{- if .Values.publicEntry.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-public-entry
spec:
  description: Public entry reconciler and connector (infra/envs/public-entry) in platform-state only
  sourceRepos:
    - https://github.com/Softbank-Hackathon-Finals/platform.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: platform-state
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - {group: apps, kind: Deployment}
    - {group: "", kind: ConfigMap}
    - {group: networking.k8s.io, kind: NetworkPolicy}
    - {group: external-secrets.io, kind: ExternalSecret}
  orphanedResources:
    warn: false
{{- end }}
